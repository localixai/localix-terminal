# The quick loop (src/main.rs): llxterm's core alone, counted in instructions, so a change to the
# core is measured in seconds with no reference core to build or link.
[package]
name = "llxterm-quick"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
llxterm-bench = { path = "..", default-features = false, features = ["ours"] }
serde_json = "1.0.154"

# As the bench crate is built, so the two share what they build (.cargo/config.toml).
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "unwind"
debug = "line-tables-only"
