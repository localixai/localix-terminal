<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>tabs</title>
<style>
:root{--ground:#f7f7f7;color:#1d1d1f;font:12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
@media (prefers-color-scheme: dark){:root{--ground:#070707;color:#e6e6e6}}
body{margin:0;cursor:default;user-select:none;-webkit-user-select:none}
/* Tinted in the colour of the tab under it (tint.rs): the bar and its words, not the menu. */
/* The page's colour over the blur of the page scrolled under the strip (under.rs), as Safari's
   bar: the page shows through, and the words inked for that colour read on it. */
#head{transition:background-color .2s}
html[data-tint] #head{background:color-mix(in srgb,var(--tint) 35%,transparent)}
html[data-tint] #projects,html[data-tint] #bar,html[data-tint] #tabs{color:var(--ink);transition:color .2s}
#head{position:relative;z-index:2}
#projects{display:none;align-items:center;gap:4px;height:32px;padding:0 12px 4px;box-sizing:border-box;overflow:hidden}
#projects.on{display:flex}
.p{flex:none;max-width:220px;height:26px;padding:0 12px;border-radius:13px;display:flex;align-items:center;gap:7px;font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.55}
.p .c{font-weight:400;opacity:.6;font-variant-numeric:tabular-nums}
.p:hover{opacity:.85;background:color-mix(in srgb,currentColor 6%,transparent)}
.p.on{opacity:1;background:color-mix(in srgb,currentColor 11%,transparent)}
/* Three columns, as Safari's toolbar: the address field stays in the middle whatever comes and goes beside it. */
#bar{display:grid;grid-template-columns:1fr minmax(120px,640px) 1fr;align-items:center;gap:10px;height:52px;padding:0 12px;box-sizing:border-box}
#bar>.grp{justify-self:start}
/* The buttons keep their room, and the address field gives way when the window is narrow; with
   less room still, the buttons go into "»" (fit). */
[hidden]{display:none!important}
#end{display:flex;align-items:center;justify-content:flex-end;gap:8px}
/* Buttons that go together share one capsule, as in the system's toolbars. */
.grp{flex:none;display:flex;align-items:center;height:32px;padding:0 2px;border-radius:16px;background:color-mix(in srgb,currentColor 6%,transparent)}
#tabs{display:flex;align-items:center;gap:4px;height:32px;padding:0 12px 4px;box-sizing:border-box;min-width:0;overflow:hidden}
#tabs .t{flex:1 1 0;max-width:none;justify-content:center;position:relative;padding:0 28px;background:color-mix(in srgb,currentColor 3.5%,transparent)}
#tabs .t .n{flex:0 1 auto}
#tabs .t .x{position:absolute;left:5px}
#tabs .t:hover{background:color-mix(in srgb,currentColor 6%,transparent)}
#tabs .t.on{background:color-mix(in srgb,currentColor 11%,transparent);font-weight:500}
/* The address field, as Safari's: the page's host while it rests, its whole address to edit. */
#addr{position:relative;min-width:0;height:32px;border-radius:16px;display:flex;align-items:center;gap:8px;padding:0 3px 0 12px;box-sizing:border-box;background:color-mix(in srgb,currentColor 6%,transparent)}
#addr:focus-within{background:color-mix(in srgb,currentColor 9%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 22%,transparent)}
#ai{flex:none;display:grid;place-items:center;opacity:.45}
#ai svg,.i svg,.x svg{display:block;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
#ai svg{width:13px;height:13px}
#url{flex:1;min-width:0;border:0;outline:0;background:transparent;color:inherit;font:13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;text-align:center;text-overflow:ellipsis}
#url:focus{text-align:left}
#url::selection{background:color-mix(in srgb,currentColor 22%,transparent)}
/* The open lists (the suggestions, the history menu), as the system's menus: on its menu glass
   (pane.rs, macOS; elsewhere the ground), compact rows, the accent on the row picked. */
#sug,#menu{position:absolute;display:none;box-sizing:border-box;padding:5px;border-radius:10px;z-index:3;overflow-y:auto;font:13px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;box-shadow:0 0 0 .5px color-mix(in srgb,currentColor 24%,transparent),0 10px 28px rgba(0,0,0,.22)}
html:not([data-glass]) #sug,html:not([data-glass]) #menu{background:var(--ground)}
html[data-tint] #sug,html[data-tint] #menu{color:var(--ink)}
#sug{max-height:calc(100vh - 60px)}
.q{display:flex;align-items:center;gap:8px;height:24px;padding:0 8px;border-radius:5px;white-space:nowrap}
.q .i{width:14px;text-align:center;opacity:.6}
.q .w{min-width:0;display:flex;align-items:baseline;gap:8px;overflow:hidden}
.q .n{flex:none;max-width:62%;overflow:hidden;text-overflow:ellipsis}
.q .u{min-width:0;font-size:12px;opacity:.5;overflow:hidden;text-overflow:ellipsis}
.q.on,.v:hover{background:#0a84ff;background:-apple-system-control-accent;color:#fff}
.q.on .i,.q.on .u,.v:hover .u{opacity:.85}
.g{padding:6px 8px 3px;font-size:11px;font-weight:600;opacity:.5}
.b{flex:none;height:28px;min-width:30px;padding:0;box-sizing:border-box;border-radius:14px;display:grid;place-items:center;opacity:.72}
.b:hover{opacity:1;background:color-mix(in srgb,currentColor 8%,transparent)}
.b.on{opacity:1;background:color-mix(in srgb,currentColor 14%,transparent)}
.b svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.t{display:flex;align-items:center;gap:7px;min-width:0;max-width:220px;height:26px;padding:0 6px 0 10px;border-radius:9px;font-size:12.5px;opacity:.62}
.t:hover{opacity:.85;background:color-mix(in srgb,currentColor 6%,transparent)}
.t.on{opacity:1;background:color-mix(in srgb,currentColor 10%,transparent)}
.i{flex:none;opacity:.6}
.i svg{width:12px;height:12px}
.n{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.x{flex:none;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;opacity:0}
.x svg{width:10px;height:10px;stroke-width:1.5}
.t:hover .x,.t.on .x{opacity:.6}
.x:hover{opacity:1!important;background:color-mix(in srgb,currentColor 14%,transparent)}
#back{position:fixed;inset:0;display:none;z-index:1}
#menu{right:8px;width:min(380px,calc(100vw - 16px));max-height:calc(100vh - 100px)}
.v{padding:4px 8px;border-radius:5px}
.v .h{display:flex;align-items:center;gap:7px}
.v .n{display:block}
.v.off .h{opacity:.62}
.v .u{display:block;margin-top:1px;padding-left:17px;font-size:11px;opacity:.5;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.e{padding:12px 9px;opacity:.5}

.s{display:none;flex:none;height:28px;padding:0 13px;border-radius:14px;align-items:center;font-weight:500;background:color-mix(in srgb,currentColor 10%,transparent)}
.s.on{display:flex}
.s:hover{background:color-mix(in srgb,currentColor 15%,transparent)}
/* Whose turn, in quiet words at the end of the address field: nothing while the agent is idle. */
#tn{display:none;position:absolute;right:36px;top:50%;transform:translateY(-50%);font-size:11.5px;white-space:nowrap;opacity:.5;pointer-events:none}
#tn.on{display:block}
/* Glass (macOS): the strip is the titlebar, its toolbar row clear of the window's buttons (a unified toolbar's: 18 to 80 points); the projects and the tabs under it run from the edge. */
html[data-glass] #bar{padding-left:92px}
#rl{height:26px;min-width:26px;border-radius:13px}
</style>
</head>
<body>
<div id="head">
  <div id="bar">
    <div class="grp">
      <span class="b" id="bk" title="Back"><svg viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg></span>
      <span class="b" id="fw" title="Forward"><svg viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5"/></svg></span>
    </div>
    <div id="addr"><span id="ai"></span><input id="url" spellcheck="false" autocomplete="off" placeholder="Search or enter website name"><span id="tn"></span><span class="b" id="rl" title="Reload"><svg viewBox="0 0 16 16"><path d="M12.6 8.2a4.6 4.6 0 1 1-1.4-3.5M12.6 3.2v2.6H10"/></svg></span></div>
    <div id="end">
    <span class="s" id="sd" title="Send the comments to the agent"></span>
    <div class="grp">
      <span class="b" id="fs" title="Page size: the window"></span>
      <span class="b" id="cm" title="Comment on the page: click what to change"><svg viewBox="0 0 16 16"><path d="M3.5 4.2c0-.7.5-1.2 1.2-1.2h6.6c.7 0 1.2.5 1.2 1.2v5.1c0 .7-.5 1.2-1.2 1.2H7.6L5 12.8v-2.3h-.3c-.7 0-1.2-.5-1.2-1.2z"/></svg></span>
      <span class="b" id="nt" title="New tab"><svg viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></svg></span>
      <span class="b" id="hs" title="History"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1.3"/></svg></span>
      <span class="b" id="mo" title="More" hidden><svg viewBox="0 0 16 16"><path d="M4.5 4.5 8 8l-3.5 3.5M8.5 4.5 12 8l-3.5 3.5"/></svg></span>
    </div>
    </div>
  </div>
  <div id="projects"></div>
  <div id="tabs"></div>
  <div id="menu"></div>
  <div id="sug"></div>
</div>
<div id="back"></div>
<script>
"use strict";
// The strip's small pictures, drawn as the buttons are; never text characters. Built element by
// element, as everything on the strip is: no markup is ever parsed.
const GLYPHS = {
  web: [["circle", { cx: 8, cy: 8, r: 5.6 }], ["path", { d: "M2.6 8h10.8M8 2.4c1.6 1.6 1.6 9.6 0 11.2M8 2.4c-1.6 1.6-1.6 9.6 0 11.2" }]],
  term: [["path", { d: "m4 5.5 2.5 2.5L4 10.5M8.5 10.5H12" }]],
  search: [["circle", { cx: 7.2, cy: 7.2, r: 4.2 }], ["path", { d: "m10.3 10.3 3 3" }]],
  close: [["path", { d: "m4.5 4.5 7 7M11.5 4.5l-7 7" }]],
  fill: [["path", { d: "M3 6V3h3M10 3h3v3M13 10v3h-3M6 13H3v-3" }]],
  phone: [["rect", { x: 5, y: 2.5, width: 6, height: 11, rx: 1.4 }], ["path", { d: "M7.3 11.6h1.4" }]],
  tablet: [["rect", { x: 3.5, y: 2.5, width: 9, height: 11, rx: 1.4 }], ["path", { d: "M7.3 11.6h1.4" }]],
  laptop: [["rect", { x: 3.5, y: 4, width: 9, height: 6.5, rx: 1 }], ["path", { d: "M2 12.5h12" }]],
  desktop: [["rect", { x: 2.5, y: 3, width: 11, height: 7.5, rx: 1 }], ["path", { d: "M8 10.5v2.5M5.5 13h5" }]],
};
function glyph(name) {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 16 16");
  for (const [tag, attrs] of GLYPHS[name]) {
    const shape = document.createElementNS(NS, tag);
    for (const [key, value] of Object.entries(attrs)) shape.setAttribute(key, value);
    svg.append(shape);
  }
  return svg;
}
// The colour of the tab under the strip and the ink that reads on it, or null: its own again.
function T(tint) {
  const root = document.documentElement;
  if (tint === null) return void root.removeAttribute("data-tint");
  root.style.setProperty("--tint", tint.ground);
  root.style.setProperty("--ink", tint.ink === "dark" ? "#1d1d1f" : "#f2f2f2");
  root.setAttribute("data-tint", "");
}
// The project shown last in each tab, so a click on a project goes back to where it was.
const lastOf = new Map();
// Draw the tabs: with several projects, a row of them above and under it the shown project's
// tabs; every name is set as text. A click says which tab, and what to do with it.
function S(data) {
  const shown = data.tabs.find((tab) => tab.key === data.shown);
  const project = shown ? shown.group : undefined;
  if (project !== undefined) lastOf.set(project, data.shown);
  const names = [...new Set(data.tabs.map((tab) => tab.group))].filter((name) => name !== undefined);
  const row = document.getElementById("projects");
  row.className = names.length > 0 ? "on" : "";
  row.replaceChildren(...names.map((name) => {
    const pill = document.createElement("div");
    pill.className = name === project ? "p on" : "p";
    const own = data.tabs.filter((tab) => tab.group === name);
    const label = document.createElement("span");
    label.textContent = name || "Other";
    const count = document.createElement("span");
    count.className = "c";
    count.textContent = own.length;
    pill.append(label, count);
    pill.title = name;
    pill.addEventListener("click", () => {
      const back = lastOf.get(name);
      const there = own.find((tab) => tab.key === back) || own[0];
      if (there) window.ipc.postMessage("show " + there.key);
    });
    return pill;
  }));
  address(shown, data.visited || []);
  const tabs = data.tabs.filter((tab) => tab.group === project);
  document.getElementById("tabs").replaceChildren(...tabs.map((tab) => {
    const item = document.createElement("div");
    item.className = tab.key === data.shown ? "t on" : "t";
    item.title = tab.title;
    const icon = document.createElement("span");
    icon.className = "i";
    icon.append(glyph(tab.kind === "term" ? "term" : "web"));
    const name = document.createElement("span");
    name.className = "n";
    name.textContent = tab.title;
    const close = document.createElement("span");
    close.className = "x";
    close.append(glyph("close"));
    close.addEventListener("click", (event) => {
      event.stopPropagation();
      window.ipc.postMessage("close " + tab.key);
    });
    item.addEventListener("click", () => window.ipc.postMessage("show " + tab.key));
    // Its menu is the system's (host_tab_menu.rs), where the person clicked.
    item.addEventListener("contextmenu", (event) => {
      event.preventDefault();
      window.ipc.postMessage("menu " + tab.key + " " + Math.round(event.clientX) + " " + Math.round(event.clientY));
    });
    item.append(icon, name, close);
    return item;
  }));
}
// The strip is the window's own: no page's menu (Reload, AutoFill) but in the address field.
document.addEventListener("contextmenu", (event) => {
  if (event.target !== field) event.preventDefault();
});
// The address field: the shown tab's page (a terminal's command, not to edit), and as the person
// types, where Enter goes (the address, else a search) and the pages seen that match it.
const field = document.getElementById("url"), sug = document.getElementById("sug");
let here = { url: "", web: true }, seen = [], rows = [], picked = 0;
const host = (url) => {
  try {
    const at = new URL(url);
    return /^https?:$/.test(at.protocol) ? at.host.replace(/^www\./, "") : url;
  } catch { return url; }
};
const addressy = (text) => /^https?:\/\//.test(text) || (!/\s/.test(text) && /^(localhost|127\.0\.0\.1|[^.\s]+\.[^\s]+)/.test(text));
function address(shown, visited) {
  seen = visited;
  here = shown ? { url: shown.url || "", web: shown.kind === "web", title: shown.title } : { url: "", web: true };
  field.readOnly = !here.web;
  document.getElementById("ai").replaceChildren(glyph(here.web ? "web" : "term"));
  if (document.activeElement !== field) field.value = here.web ? host(here.url) : here.title || "";
}
function suggest() {
  const typed = field.value.trim(), low = typed.toLowerCase();
  rows = [];
  if (typed && typed !== here.url) {
    rows.push(addressy(typed) ? { go: typed, name: typed, about: "Go to the website" } : { go: typed, name: typed, about: "Search Google", search: true });
  }
  const matches = seen.filter((page) => page.url !== here.url && (!low || (page.title + " " + page.url).toLowerCase().includes(low)));
  const pages = matches.slice(0, 8).map((page) => ({ go: page.url, name: page.title || host(page.url), about: page.url }));
  picked = 0;
  const parts = [];
  const row = (item, at) => {
    const line = document.createElement("div");
    line.className = at === picked ? "q on" : "q";
    const icon = document.createElement("span");
    icon.className = "i";
    icon.append(glyph(item.search ? "search" : "web"));
    const words = document.createElement("span");
    words.className = "w";
    const name = document.createElement("span");
    name.className = "n";
    name.textContent = item.name;
    const about = document.createElement("span");
    about.className = "u";
    about.textContent = item.about;
    words.append(name, about);
    line.append(icon, words);
    line.addEventListener("mousedown", (event) => event.preventDefault());
    line.addEventListener("click", () => go(item));
    return line;
  };
  if (rows.length > 0) parts.push(row(rows[0], 0));
  if (pages.length > 0) {
    const label = document.createElement("div");
    label.className = "g";
    label.textContent = "History";
    parts.push(label);
    for (const page of pages) {
      rows.push(page);
      parts.push(row(page, rows.length - 1));
    }
  }
  sug.replaceChildren(...parts);
  const box = document.getElementById("addr").getBoundingClientRect();
  Object.assign(sug.style, { left: box.left + "px", top: box.bottom + 6 + "px", width: box.width + "px", display: parts.length ? "block" : "none" });
  glass();
}
// The system's glass under the open list (pane.rs): where it is, said once each time it moves.
let glassed = "";
function glass() {
  const open = [sug, document.getElementById("menu")].find((list) => list.style.display === "block");
  const box = open && open.getBoundingClientRect();
  const said = box ? "glass " + [box.left, box.top, box.width, box.height].map(Math.round).join(" ") : "glass none";
  if (said !== glassed) {
    glassed = said;
    window.ipc.postMessage(said);
  }
}
addEventListener("resize", glass);
function mark() {
  sug.querySelectorAll(".q").forEach((line, at) => { line.className = at === picked ? "q on" : "q"; });
}
function go(item) {
  window.ipc.postMessage("go " + item.go);
  field.blur();
}
field.addEventListener("focus", () => {
  if (!here.web) return;
  window.ipc.postMessage("typing on");
  field.value = here.url;
  field.select();
});
field.addEventListener("input", suggest);
field.addEventListener("blur", () => {
  window.ipc.postMessage("typing off");
  sug.style.display = "none";
  glass();
  field.value = here.web ? host(here.url) : here.title || "";
});
field.addEventListener("keydown", (event) => {
  if (event.key === "ArrowDown" || event.key === "ArrowUp") {
    event.preventDefault();
    if (rows.length) picked = (picked + (event.key === "ArrowDown" ? 1 : rows.length - 1)) % rows.length;
    mark();
  } else if (event.key === "Enter") {
    event.preventDefault();
    const item = rows[picked] || (field.value.trim() && { go: field.value.trim() });
    if (item) go(item);
  } else if (event.key === "Escape") {
    field.blur();
  }
});
document.getElementById("rl").addEventListener("click", () => window.ipc.postMessage("reload"));
// "+": the system's menu under the button, a page or a terminal (menu.rs).
document.getElementById("nt").addEventListener("click", () => {
  const box = document.getElementById("nt").getBoundingClientRect();
  window.ipc.postMessage("new " + Math.round(box.left) + " " + Math.round(box.bottom + 4));
});
// The history menu: the tabs the window has held, newest first, each with what became of it;
// null closes it. Titles, pages and projects are set as text.
const SAID = { open: "open", hidden: "closed · still running", ended: "ended", closed: "closed" };
function M(rows) {
  // Once the rows are in: where the menu is now.
  requestAnimationFrame(glass);
  const menu = document.getElementById("menu");
  const open = rows !== null;
  menu.style.display = document.getElementById("back").style.display = open ? "block" : "none";
  document.getElementById("hs").className = open ? "b on" : "b";
  if (!open) return menu.replaceChildren();
  menu.style.top = document.getElementById("head").offsetHeight + 2 + "px";
  if (rows.length === 0) {
    const none = document.createElement("div");
    none.className = "e";
    none.textContent = "No tabs yet";
    menu.replaceChildren(none);
    return;
  }
  const several = new Set(rows.map((row) => row.group)).size > 1;
  menu.replaceChildren(...rows.map((row) => {
    const item = document.createElement("div");
    item.className = row.state === "open" ? "v" : "v off";
    item.dataset.at = row.at;
    item.dataset.key = row.key;
    item.dataset.state = row.state;
    item.title = row.detail || row.title;
    const icon = document.createElement("span");
    icon.className = "i";
    icon.append(glyph(row.kind === "term" ? "term" : "web"));
    const name = document.createElement("span");
    name.className = "n";
    name.textContent = row.title || row.detail || (row.kind === "term" ? "Terminal" : "New tab");
    const head = document.createElement("span");
    head.className = "h";
    head.append(icon, name);
    const about = document.createElement("span");
    about.className = "u";
    about.textContent = [several ? row.group || "—" : "", row.detail, SAID[row.state]].filter(Boolean).join(" · ");
    item.append(head, about);
    item.addEventListener("click", () => window.ipc.postMessage("visit " + row.at));
    return item;
  }));
}
// The comment button, on while the person comments on the pages, and Send while some are held.
function C(on, held) {
  document.getElementById("cm").className = on ? "b on" : "b";
  const send = document.getElementById("sd");
  send.className = held > 0 ? "s on" : "s";
  send.textContent = "Send " + held;
  fit();
}
// Whose turn it is, said quietly in the address field: "acting" (the agent works on a page),
// "paused" (the person comments, the agent's actions wait), "waiting" (one waits now), "" (nothing).
function A(turn) {
  const words = {
    acting: ["Agent is working", "The agent is acting on a page"],
    paused: ["Paused while you comment", "The agent's actions wait while you comment. Send, or turn comments off, to let it go on"],
    waiting: ["Agent is waiting for you", "The agent wants to act and waits while you comment. Send, or turn comments off, to let it go on"],
  }[turn];
  const tn = document.getElementById("tn");
  tn.className = words ? "on" : "";
  tn.textContent = words ? words[0] : "";
  tn.title = words ? words[1] : "";
}
// The page's size, as its device's picture: lit while a size is set; the size itself is in its tip
// and in the menu (null: the page fills the window).
function F(size) {
  const fs = document.getElementById("fs");
  const kind = !size ? "fill" : size.width < 600 ? "phone" : size.width < 1000 ? "tablet" : size.width < 1400 ? "laptop" : "desktop";
  fs.replaceChildren(glyph(kind));
  fs.className = size ? "b on" : "b";
  const shown = size && size.percent < 100 ? ", shown at " + size.percent + "% to fit the window" : "";
  fs.title = size ? "Page size: " + size.name + ", " + size.width + " × " + size.height + shown : "Page size: the window";
}
F(null);
// "Page size": the system's menu under the button (frame.rs), the sizes to pick from.
document.getElementById("fs").addEventListener("click", () => {
  const box = document.getElementById("fs").getBoundingClientRect();
  window.ipc.postMessage("frame " + Math.round(box.left) + " " + Math.round(box.bottom + 4));
});
// Buttons with no room, as Safari's: the rightmost go first into "»", whose system menu holds
// them (strip.rs's Tool), until the address field has its room again.
const TOOLS = ["fs", "cm", "nt", "hs"];
const ROOM = 200;
function fit() {
  const addr = document.getElementById("addr");
  const bar = document.getElementById("bar");
  const more = document.getElementById("mo");
  for (const id of TOOLS) document.getElementById(id).hidden = false;
  more.hidden = true;
  const tight = () => addr.getBoundingClientRect().width < ROOM || bar.scrollWidth > bar.clientWidth;
  for (const id of [...TOOLS].reverse()) {
    if (!tight()) break;
    document.getElementById(id).hidden = true;
    more.hidden = false;
  }
}
new ResizeObserver(fit).observe(document.getElementById("bar"));
document.getElementById("mo").addEventListener("click", () => {
  const box = document.getElementById("mo").getBoundingClientRect();
  const held = TOOLS.filter((id) => document.getElementById(id).hidden);
  window.ipc.postMessage("more " + Math.round(box.left) + " " + Math.round(box.bottom + 4) + " " + held.join(" "));
});
// The strip's empty part moves the window, and a double click zooms it, as a titlebar does.
for (const id of ["projects", "bar", "tabs", "end"]) {
  const part = document.getElementById(id);
  part.addEventListener("mousedown", (event) => {
    if (event.target === part && event.button === 0 && event.detail === 1) window.ipc.postMessage("drag");
  });
  part.addEventListener("dblclick", (event) => {
    if (event.target === part) window.ipc.postMessage("zoom");
  });
}
for (const [id, what] of [["sd", "send"], ["cm", "comment"], ["bk", "back"], ["fw", "forward"], ["hs", "history"], ["back", "history"]]) {
  document.getElementById(id).addEventListener("click", () => window.ipc.postMessage(what));
}
</script>
</body>
