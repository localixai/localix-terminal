<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha384-{{hash}}'">
<title>tabs</title>
<style>
:root{--ground:#f7f7f7;font:12px/15px var(--ui-font,var(--ui-sys));color:var(--fg);-webkit-font-smoothing:antialiased}
:root{--card:rgba(252,252,253,.97)}
/* The system's purple, which WebKit names no keyword for: its light and dark values. */
:root{--purple:#af52de}
@media (prefers-color-scheme: dark){:root{--purple:#bf5af2}}
@media (prefers-color-scheme: dark){:root{--ground:#070707}}
@media (prefers-color-scheme: dark){:root{--card:rgba(44,44,47,.97)}}
/* Reduced transparency (data-reduced, said by the app): the card is the ground, solid. */
html[data-reduced]{--card:#fcfcfd}
@media (prefers-color-scheme: dark){html[data-reduced]{--card:#2c2c2f}}
body{margin:0;cursor:default;user-select:none;-webkit-user-select:none}
/* The bar is the window's own, in its theme, over whatever tab: never in a page's colours. */
#head{position:relative;z-index:2}
/* The offer bar (offer.rs): one offer at a time, under the toolbar, at the moment it fits, with
   the button that does it and Not Now. Its height is the window's to lay out (offer::ROW). */
#offer{display:none;height:36px;padding:0 8px 8px;box-sizing:border-box}
#offer.on{display:block}
#offer .card{height:100%;display:flex;align-items:center;gap:12px;padding:0 2px 0 10px;border-radius:var(--r-3);font-size:12px;line-height:15px;background:var(--ov-1);box-shadow:var(--sh-hair)}
#offer .mk{flex:none;width:14px;height:14px;display:flex}
#offer .mk svg{width:14px;height:14px}
#offer .mk:empty{display:none}
#offer .says{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
#offer.busy .says{color:var(--ink-2)}
#offer.failed .says{color:-apple-system-red}
@keyframes offer-in{from{opacity:0}to{opacity:1}}
#offer.on .card{animation:offer-in var(--t-out) var(--ease)}
#offer button{flex:none;border:0;color:inherit;font:500 12px/24px var(--ui-font,var(--ui-sys));transition:background-color var(--t-out) var(--ease),color var(--t-out) var(--ease)}
#offer button:hover,#offer button:active{transition:none}
#offer button.take{height:24px;padding:0 10px;border-radius:var(--r-2);font-weight:600;background:var(--ov-2)}
#offer button.take:hover{background:var(--ov-3)}
#offer button.take:active{background:var(--ov-4)}
#offer button.later{width:24px;height:24px;padding:0;border-radius:var(--r-2);background:none;color:var(--ink-2);display:grid;place-items:center}
#offer button.later:hover{color:var(--ink);background:var(--ov-2)}
#offer button.later:active{background:var(--ov-3)}
#offer button.later svg{width:10px;height:10px;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;fill:none}
/* The bar (`strip::BAR` points, a compact titlebar's; its height and the browser's toolbar's
   and the tabs' row's are filled in from strip.rs): beside the window's buttons, where the shown tab
   is, as crumbs: its project (a folder), then the tab; each a button whose menu is the system's
   (host_project.rs): every project and Open Folder, or the project's tabs. A dot on the project's
   crumb: something happened in another one, out of sight. Then the window's own buttons. */
#cr{display:flex;align-items:center;gap:2px;min-width:0;overflow:hidden;white-space:nowrap}
#cr .c{flex:0 1 auto;display:flex;align-items:center;gap:5px;min-width:0;height:24px;padding:0 6px;border-radius:6px;font-size:12px;line-height:15px;font-weight:400;color:var(--ink-2);transition:background-color var(--t-out) var(--ease),color var(--t-out) var(--ease)}
#cr .c:hover{color:var(--ink);background:var(--ov-2);transition:none}
#cr .c:active{background:var(--ov-3);transition:none}
#cr .c .n{min-width:0;overflow:hidden;text-overflow:ellipsis}
#cr .c.here{flex:0 2 auto;font-size:12px;line-height:15px;font-weight:500;color:var(--fg)}
#cr .c svg{flex:none;width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
#cr .c .mk{display:flex}
#cr .c .mk svg{fill:currentColor;stroke:none}
#cr .c .dn{width:9px;height:9px;stroke-width:1.6}
#cr .c .d,#tabs .t .d{flex:none;width:6px;height:6px;border-radius:3px;background:var(--accent)}
#cr .sep{flex:none;padding:0 1px;font-size:12px;line-height:15px;color:var(--ink-3)}
#cr .b{width:24px;min-width:24px;height:24px;border-radius:6px;margin-left:2px}
#cr .b svg{width:14px;height:14px}
/* The bar: the crumbs, then the window's own buttons at the end. The crumbs give way when the
   window is narrow, and with less room still the buttons go into "»" (fit). */
#bar{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;height:{{bar}}px;padding:0 8px;box-sizing:border-box}
#lead{display:flex;align-items:center;gap:4px;min-width:0}
/* A button fit() puts into "»" is hidden. */
[hidden]{display:none!important}
/* Back, forward and reload, bare as in Safari's toolbar. */
#nav{flex:none;display:flex;align-items:center;gap:2px}
#rl svg{width:15px;height:15px}
#end{display:flex;align-items:center;justify-content:flex-end;gap:8px}
/* The browser's toolbar (data-part=nav): the same page in a view of its own over a page only,
   back, forward and reload, the address field, the page's size and comments. The bar is the
   strip's; this view shows nothing else, and the strip none of this. */
#browse{display:none}
/* A tab dragged: it lifts under the pointer, its place in the list held faintly, the others moving
   aside; dragged out over the pages, the half it would go into is shown there (the line's view).
   The card is the row itself, drawn in #gh over the page so that it keeps the row's styling. */
#gh{position:fixed;inset:0;pointer-events:none;z-index:9}
#sl .t.held{background:var(--ov-1)!important;box-shadow:none!important;opacity:1}
/* The row as the card it becomes, the moment its picture is taken. */
#sl .t.shot{background:var(--card)!important;box-shadow:var(--hair-in)!important;color:var(--fg)!important;opacity:1;transition:none!important}
#sl .t.held>*{visibility:hidden}
.t.lift{position:fixed;z-index:9;margin:0;pointer-events:none;border-radius:var(--r-4);opacity:1;background:var(--card);box-shadow:var(--hair-in);scale:1;will-change:transform;transition:scale var(--t-move) var(--spring),opacity var(--t-out)}
.t.lift.up{scale:1.025;box-shadow:var(--sh-lift)}
.t.lift.out{scale:.98}
.t.lift.home{transition:transform var(--t-move) var(--spring-b),scale var(--t-move) var(--spring-b),opacity var(--t-out)}
@media (prefers-reduced-motion:reduce){.t.lift.up,.t.lift.out{scale:1}}
/* The arrow over every control and row, as the system's own; the I-beam only where words are
   typed, the hand only over a link. The side's edge and the halves' line keep their resize
   cursor. */
:where(a[href]){cursor:pointer}
:where(#url,#sq,#sk,textarea){cursor:text}
html.dragging,html.dragging *{cursor:grabbing!important;user-select:none}
#line{display:none}
html[data-part=line] body>*:not(#line){display:none!important}
html[data-part=line],html[data-part=line] body{background:transparent!important}
html[data-part=line] #line{display:block;position:fixed;inset:0;cursor:col-resize;touch-action:none;outline:none}
/* The line between the halves: one point, a quiet fill; hot (under the pointer, held) the
   accent, its width never changing. */
html[data-part=line] #line::after{content:"";position:absolute;top:0;bottom:0;left:calc(50% - .5px);width:1px;background:var(--ov-3);transition:background-color var(--t-out) var(--ease)}
html[data-part=line] #line:hover::after,html[data-part=line] #line.held::after,html[data-part=line] #line:focus-visible::after{background:var(--accent);transition:none}
html[data-part=line].held,html[data-part=line].held *{cursor:col-resize!important;user-select:none}
/* The documents' row (data-part=docs): the same page in a view of its own over the documents of
   the session shown. It is the row of tabs alone, each as wide as its name needs and no wider
   than a tab of the side; the one in sight is lit. More than fit never narrow: the row scrolls
   sideways with no bar of its own, and an edge with more past it fades out (data-more). The
   hairline under the row is the head's, so it does not fade with the tabs. */
html[data-part=docs] body>*:not(#head),html[data-part=docs] #head>*:not(#tabs){display:none!important}
html[data-part=docs],html[data-part=docs] body,html[data-part=docs] #head{height:100%;overflow:hidden}
html[data-part=docs]:not([data-glass]) body{background:var(--ground)}
html[data-part=docs] #head{box-shadow:inset 0 -.5px 0 var(--ov-3)}
html[data-part=docs] #tabs{padding:0 8px;height:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior:contain}
html[data-part=docs] #tabs::-webkit-scrollbar{display:none}
html[data-part=docs] #tabs[data-more=left]{-webkit-mask-image:linear-gradient(to right,transparent,#000 24px);mask-image:linear-gradient(to right,transparent,#000 24px)}
html[data-part=docs] #tabs[data-more=right]{-webkit-mask-image:linear-gradient(to left,transparent,#000 24px);mask-image:linear-gradient(to left,transparent,#000 24px)}
html[data-part=docs] #tabs[data-more=both]{-webkit-mask-image:linear-gradient(to right,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to right,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
html[data-part=docs] #tabs .t{flex:none;max-width:220px;justify-content:flex-start;padding:0 6px 0 10px}
html[data-part=docs] #tabs .t .x{position:static}
@media (prefers-contrast:more){html[data-part=docs] #head{box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--fg) 45%,transparent)}}
html[data-part=nav] #bar,html[data-part=nav] #tabs,html[data-part=nav] #offer,html[data-part=nav] #menu,html[data-part=nav] #back{display:none!important}
/* Three columns, as Safari's toolbar: the address field stays in the middle whatever comes and goes beside it. */
html[data-part=nav] #browse{display:grid;grid-template-columns:1fr minmax(120px,720px) 1fr;align-items:center;gap:8px;height:{{nav}}px;padding:0 8px;box-sizing:border-box;box-shadow:inset 0 -.5px 0 var(--ov-3)}
@media (prefers-contrast:more){html[data-part=nav] #browse{box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--fg) 45%,transparent)}}
html[data-part=nav]:not([data-glass]) #browse{background:var(--ground)}
#browse #addr{width:100%}
#browse #nav{justify-self:start}
#browse #tools{justify-self:end}
/* Every empty place says so the same way: one quiet line, centred, of what would be there; no
   glyph, no frame, nothing to press ("+" opens what can be). */
.empty{display:flex;align-items:center;justify-content:center;text-align:center;padding:26px 16px;box-sizing:border-box;font-size:13px;line-height:16px;color:var(--ink-2)}
#sl .empty{flex:1}
/* Where a tab carried in from another window would go: an empty place, as the held row's. */
#sl .slot{flex:none;border-radius:var(--r-4);background:var(--ov-1)}
/* A tab held: the side covers the window, clear past its column, which keeps its width. */
#blank{display:none}
html[data-part=nav][data-blank] #browse{display:none}
html[data-part=nav][data-blank] #blank{position:fixed;inset:0;display:flex;overflow:hidden}
/* No tab left, the pages' whole part offers what opens one, as a menu would: each command and
   its key, quiet until pointed at. The keys are the person's, from Settings. */
#blank .start{margin:auto;display:flex;flex-direction:column;gap:2px;width:248px}
#blank .start button{font:inherit;font-size:13px;line-height:16px;color:var(--ink-2);background:none;border:0;border-radius:var(--r-2);height:28px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;gap:24px;transition:background-color var(--t-out) var(--ease),color var(--t-out) var(--ease)}
#blank .start button:hover{background:var(--ov-2);color:var(--fg);transition:none}
#blank .start button:active{background:var(--ov-3);transition:none}
#blank .start button:focus-visible{outline:auto 1px -webkit-focus-ring-color;outline-offset:-1px}
#blank .start kbd{font:inherit;color:var(--ink-3);font-variant-numeric:tabular-nums}
/* Under them, the agents installed, centred under the column: each its mark alone, an icon button
   as any other; its name is its tooltip. */
#blank .start .agents{display:flex;justify-content:center;gap:4px;margin-top:10px}
#blank .start .agents:empty{display:none}
#blank .start .agents button{width:28px;justify-content:center;padding:0}
#blank .start .agents svg{width:16px;height:16px}
#tools{display:flex;align-items:center;gap:4px}
/* The bar is bare: icons and words on the glass, no capsules. A button lights as the pointer
   comes; only one that is on (comments, a page size) and the field being typed in have a ground. */
.grp{flex:none;display:flex;align-items:center;gap:2px;height:28px}
#tabs{display:flex;align-items:center;gap:4px;height:{{row}}px;padding:0 12px 4px;box-sizing:border-box;min-width:0;overflow:hidden}
#tabs .t{flex:1 1 0;max-width:none;justify-content:center;position:relative;padding:0 28px;background:color-mix(in srgb,currentColor 3.5%,transparent)}
#tabs .t .n{flex:0 1 auto}
#tabs .t .x{position:absolute;left:5px}
#tabs .t:hover{background:color-mix(in srgb,currentColor 6%,transparent)}
#tabs .t.on{background:color-mix(in srgb,currentColor 11%,transparent);font-weight:500}
/* The address field, as Safari's: the page's host while it rests, its whole address to edit. */
#addr{position:relative;cursor:text;background:var(--ov-1);min-width:0;height:28px;border-radius:14px;display:flex;align-items:center;gap:8px;padding:0 3px 0 12px;box-sizing:border-box;transition:background-color var(--t-out) var(--ease),color var(--t-out) var(--ease)}
#addr:hover{background:var(--ov-2);transition:none}
#addr:focus-within{background:var(--ov-1);box-shadow:inset 0 0 0 1px var(--accent),0 0 0 3px var(--acc-2);transition:none}
#ai{flex:none;display:grid;place-items:center;color:var(--ink-2)}
#ai svg,.i svg,.x svg{display:block;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
#ai svg{width:13px;height:13px}
#url{flex:1;min-width:0;border:0;outline:0;background:transparent;color:inherit;font:13px/16px var(--ui-font,var(--ui-sys));text-align:center;text-overflow:ellipsis}
#url:focus{text-align:left}
#url::placeholder{color:-apple-system-placeholder-text;opacity:1}
#url::selection{background:-apple-system-selected-text-background}
/* The open lists (the suggestions, the history menu), as the system's menus: on its menu glass
   (pane.rs, macOS; elsewhere the ground), compact rows, the accent on the row picked. */
#sug,#menu{position:absolute;display:none;box-sizing:border-box;padding:5px 4px;border-radius:var(--r-4);z-index:3;overflow-y:auto;font:13px/16px var(--ui-font,var(--ui-sys));box-shadow:var(--sh-pop)}
html:not([data-glass]) #sug,html:not([data-glass]) #menu{background:var(--ground)}
#sug{max-height:calc(100vh - 60px)}
.q{display:flex;align-items:center;gap:8px;height:24px;padding:0 8px;border-radius:var(--r-2);white-space:nowrap}
.q .i{width:14px;text-align:center;opacity:.6}
.q .w{min-width:0;display:flex;align-items:baseline;gap:8px;overflow:hidden}
.q .n{flex:none;max-width:62%;overflow:hidden;text-overflow:ellipsis}
.q .u{min-width:0;font-size:12px;line-height:15px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}
/* As the system's menus: the row under the pointer or the keyboard's pick is the accent, solid,
   with white words; the light goes out over a moment, never in. */
.q,.v{transition:background-color var(--t-out) var(--ease),color var(--t-out) var(--ease)}
.q:hover,.v:hover{background:var(--acc-2);transition:none}
.q:active,.v:active{background:var(--acc-3);transition:none}
.q.on,.q.on:hover,.v.sel{background:var(--acc-sel);color:var(--on-sel);transition:none}
.q.on .i,.v.sel .i{opacity:.85}
.q.on .u,.v.sel .u{color:inherit;opacity:.85}
.gh{padding:6px 8px 3px;font-size:11px;line-height:14px;font-weight:600;color:var(--ink-2)}
.b{flex:none;width:28px;min-width:28px;height:28px;padding:0;box-sizing:border-box;border-radius:var(--r-2);display:grid;place-items:center;color:var(--ink-2);transition:background-color var(--t-out) var(--ease),color var(--t-out) var(--ease)}
.b:hover{color:var(--ink);background:var(--ov-2);transition:none}
.b:active{background:var(--ov-3);transition:none}
.b.on{color:var(--fg);background:var(--ov-3)}
.b.on:hover{background:var(--ov-4)}
.b svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.t{display:flex;align-items:center;gap:7px;min-width:0;max-width:220px;height:26px;padding:0 6px 0 10px;border-radius:var(--r-3);font-size:12px;line-height:15px;color:var(--ink-2);transition:background-color var(--t-out) var(--ease),color var(--t-out) var(--ease)}
.t:hover{color:var(--ink);background:color-mix(in srgb,currentColor 6%,transparent);transition:none}
.t.on{color:var(--fg);background:color-mix(in srgb,currentColor 10%,transparent)}
.i{flex:none;opacity:.6}
.i svg{width:12px;height:12px}
.n{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.x{flex:none;width:20px;height:20px;border-radius:var(--r-1);display:grid;place-items:center;opacity:0;transition:background-color var(--t-out) var(--ease),color var(--t-out) var(--ease)}
.x svg{width:10px;height:10px;stroke-width:1.5}
.t:hover .x,.t.on .x{opacity:.6}
.x:hover{opacity:1!important;background:color-mix(in srgb,currentColor 14%,transparent);transition:none}
#back{position:fixed;inset:0;display:none;z-index:1}
#menu{right:8px;width:min(380px,calc(100vw - 16px));max-height:calc(100vh - 100px)}
.v{padding:4px 8px;border-radius:var(--r-2)}
.v .h{display:flex;align-items:center;gap:7px}
.v .n{display:block}
.v.off .n{color:var(--ink-2)}
.v.off .i{opacity:.6}
.v .u{display:block;margin-top:1px;padding-left:17px;font-size:11px;line-height:14px;color:var(--ink-2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* The Event Center: its button, marked with the crumbs' dot while something new wants the person,
   and each event with what it is, its words and its buttons. */
#ev,:is(#sl,#gh) .ic{position:relative}
#ev .d,:is(#sl,#gh) .ic .d{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:3px;background:var(--accent)}
/* A tab that waits for the person, out of sight: the same dot, on its icon's corner. */
:is(#sl,#gh) .ic .d{top:-1px;right:-1px}
.ev{display:grid;grid-template-columns:8px minmax(0,1fr) auto;align-items:center;column-gap:9px;padding:5px 8px;border-radius:var(--r-2);transition:background-color var(--t-out) var(--ease),color var(--t-out) var(--ease)}
.ev.go:hover{background:var(--acc-2);transition:none}
.ev.go:active{background:var(--acc-3);transition:none}
.ev.go.sel,.ev.go.sel:hover{background:var(--acc-sel);color:var(--on-sel)}
.ev.sel .u,.ev.sel .w{color:inherit;opacity:.85}
.ev.sel .act{box-shadow:inset 0 0 0 1px currentColor}
.ev .dot{width:7px;height:7px;border-radius:4px;background:var(--hue);opacity:.35}
.ev.new .dot{opacity:1}
.ev .tx{min-width:0}
.ev .n .mk{display:inline-flex;width:12px;height:12px;margin-right:5px;vertical-align:-1.5px}
.ev .n .mk svg{width:12px;height:12px}
.ev .n{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .u{display:block;margin-top:1px;font-size:11px;line-height:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .side{display:flex;align-items:center;gap:4px}
/* The time and the × share one place: neither moves the row, the × takes the time's place under the
   pointer or the keyboard's pick. */
.ev .tm{display:grid;min-width:22px;justify-items:end;align-items:center}
.ev .tm>*{grid-area:1/1}
.ev .w{font-size:11px;line-height:14px;color:var(--ink-2);text-align:right}
.ev .x{width:20px;height:20px;border-radius:var(--r-pill);display:grid;place-items:center;opacity:0;pointer-events:none}
.ev:hover .x,.ev.sel .x{opacity:.55;pointer-events:auto}
.ev:hover .w,.ev.sel .w{opacity:0}
/* An event's button: outlined, so its words read on any ground; filled only in the blue tone. */
.ev .act{height:20px;padding:0 8px;border:0;border-radius:var(--r-pill);font:500 11px/20px var(--ui-font,var(--ui-sys));color:inherit;background:transparent;box-shadow:inset 0 0 0 1px var(--ov-4);transition:background-color var(--t-out) var(--ease)}
.ev .act:hover{background:var(--ov-2);transition:none}
.ev .act:active{background:var(--ov-3);transition:none}
.ev[data-tone=blue] .act{color:var(--on-acc);background:var(--hue);box-shadow:none}
.ev[data-tone=blue] .act:hover{background:color-mix(in srgb,var(--hue) 88%,#fff)}
.ev[data-tone=blue] .act:active{background:color-mix(in srgb,var(--hue) 80%,#000)}
.ev.sel[data-tone=blue] .act{background:var(--on-acc);color:var(--accent)}
.ev .x:hover{opacity:1;background:color-mix(in srgb,currentColor 12%,transparent)}
.ev .x svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.evh{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px 8px;font-weight:600}
.evh .clr{font:inherit;font-size:11px;line-height:14px;font-weight:500;color:var(--accent);background:none;border:0;border-radius:var(--r-1);height:20px;padding:0 8px;transition:background-color var(--t-out) var(--ease)}
.evh .clr:hover{background:var(--ov-2);transition:none}

.evl{flex:1;min-height:0;overflow-y:auto}

/* The keyboard reaches every button, and its focus shows as the system's ring (not the pointer's). */

html[data-glass][data-full] #bar{padding-left:4px}

html[data-part=side] #head,html[data-part=side] #back{display:none}
#side{display:none}
html[data-part=side],html[data-part=side] body{height:100%;overflow:hidden}

html[data-part=side] #side{display:flex;flex-direction:column;gap:8px;height:100%;padding:4px 8px 8px;box-sizing:border-box;box-shadow:inset -.5px 0 0 var(--ov-3)}
@media (prefers-contrast:more){html[data-part=side] #side{box-shadow:inset -1px 0 0 color-mix(in srgb,var(--fg) 45%,transparent)}}
/* The side's head: the search as a line of the column, no field drawn around it, and its two

#sh{flex:none;display:flex;align-items:center;gap:2px;height:28px}
#sk{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:100%;padding:0 4px;border-radius:var(--r-2);box-sizing:border-box;cursor:text}
/* Typed in, the field shows the system's focus ring, as the address field does. */

html[data-inactive] #sk:focus-within{box-shadow:none}
#si{flex:none;display:grid;color:var(--ink-2);pointer-events:none}
#si svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}
#sq{flex:1;min-width:0;height:100%;border:0;outline:0;padding:0;background:none;color:inherit;font:13px/16px var(--ui-font,var(--ui-sys))}

#sh .b{min-width:28px;height:28px;border-radius:var(--r-2)}

#sh .b:active,#sh .b.on{background:var(--ov-3)}
#sl{position:relative;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px}

#sl .t,#sl .t.pair .half{transition:background-color var(--t-out) var(--ease),color var(--t-out) var(--ease)}
#sl .t:hover,#sl .t.pair .half:hover{transition:none}
:is(#sl,#gh) .t:not(.pair){color:var(--ink)}
#sl .t:not(.pair):hover{background:var(--ov-1)}
#sl .t:not(.pair):active,#sl .t.pair .half:active{background:var(--ov-3);transition:none}
#sl .t.on:not(.pair){color:var(--fg);background:var(--ov-2);box-shadow:var(--hair-in)}
:is(#sl,#gh) .ic{flex:none;width:28px;height:28px;border-radius:var(--r-3);display:grid;place-items:center;opacity:1;background:var(--ov-2)}
:is(#sl,#gh) .ic svg{width:16px;height:16px}
:is(#sl,#gh) .ic .mk{display:grid;place-items:center}
:is(#sl,#gh) .ic .mk svg{width:16px;height:16px}
:is(#sl,#gh) .t.on .ic{background:var(--ov-3)}
:is(#sl,#gh) .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
:is(#sl,#gh) .n{font-size:13px;font-weight:500;line-height:16px}
:is(#sl,#gh) .u{font-size:11px;line-height:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#sl .t:not(.pair):hover .x,#sl .half:hover .x{opacity:.6}
#sl .x:hover{opacity:1;background:var(--ov-2);transition:none}
#sl .x:active{opacity:1;background:var(--ov-3);transition:none}
#sl .t.on:not(:hover) .x,#sl .t.pair .half:not(:hover) .x{opacity:0}

#sl:focus-visible [data-pick] .u{color:inherit;opacity:.85}

html[data-inactive] :is(#sl,#gh) .ic svg,html[data-inactive] #si{opacity:.6}

:is(#sl,#gh) .t.pair .half{display:flex;align-items:center;gap:8px;min-width:0;padding:5px 6px;border-radius:var(--r-4);color:var(--ink)}
#sl .t.pair .half:hover{background:var(--ov-1)}
:is(#sl,#gh) .t.pair .half.on{color:var(--fg);background:var(--ov-2);box-shadow:var(--hair-in)}
:is(#sl,#gh) .t.pair .half:not(.on) .ic{background:var(--ov-2);box-shadow:none}
:is(#sl,#gh) .t.pair .cut{flex:none;height:.5px;margin:1px 10px;background:var(--ov-3)}

/* The side's edge: dragged, the side is wider or narrower; a double click sets it back. */
#grip{display:none;position:fixed;top:0;right:0;bottom:0;width:7px;cursor:col-resize;z-index:4;touch-action:none;outline:none}
html[data-part=side] #grip{display:block}

html.resizing,html.resizing *{cursor:col-resize!important;user-select:none}

   its name as the pointer rests on it. */
@media (max-width:120px){
  html[data-part=side] #side{padding:6px 0 8px;align-items:center}
  html[data-part=side] #sh{padding:0;justify-content:center;width:100%}

  html[data-part=side] #sl{align-items:center;width:100%;gap:4px}

  html[data-part=side] :is(#sl,#gh) .t > :not(.ic){display:none}
  html[data-part=side] #sl .empty{display:none}

     one shown filled, the one under the pointer lit, a press sinking it. */
  html[data-part=side] #sh .b,html[data-part=side] :is(#sl,#gh) .ic{width:32px;min-width:32px;height:32px;border-radius:var(--r-3);background:transparent;transition:background-color var(--t-out) var(--ease),color var(--t-out) var(--ease)}
  /* The 52 point rail shows no frame round a tile: the tile alone is lit. */
  html[data-part=side] :is(#sl,#gh) .t:not(.pair):is(:hover,.on),html[data-part=side] :is(#sl,#gh) .t.pair .half:is(:hover,.on){box-shadow:none;background:none}
  html[data-part=side] #sh .b svg,html[data-part=side] :is(#sl,#gh) .ic svg{width:16px;height:16px}
  html[data-part=side] :is(#sl,#gh) .ic .mk svg{width:17px;height:17px}
  html[data-part=side] :is(#sl,#gh) .t.on .ic{background:var(--ov-3);box-shadow:var(--hair-in)}
  html[data-part=side] #sh .b:hover,html[data-part=side] :is(#sl,#gh) .t:hover .ic{color:var(--ink);background:var(--ov-2);transition:none}
  html[data-part=side] :is(#sl,#gh) .t.on:hover .ic{background:var(--ov-4)}
  html[data-part=side] #sh .b:active,html[data-part=side] :is(#sl,#gh) .t:active .ic{background:var(--ov-3);transition:none}
  html[data-part=side] :is(#sl,#gh) .t.pair{flex-direction:column;gap:3px;padding:3px;border-radius:var(--r-5)}
  html[data-part=side] :is(#sl,#gh) .t.pair .half{flex:none;padding:0;justify-content:center;background:none}
  html[data-part=side] :is(#sl,#gh) .t.pair .half > :not(.ic),html[data-part=side] :is(#sl,#gh) .t.pair .cut{display:none}
  html[data-part=side] :is(#sl,#gh) .t.pair .half.on .ic{background:var(--ov-3)}
  html[data-part=side] :is(#sl,#gh) .t.pair .half:not(.on) .ic{background:transparent}
  html[data-part=side] :is(#sl,#gh) .t.pair .half:hover .ic{color:var(--ink);background:var(--ov-2);transition:none}
  html[data-part=side] #gh .t.lift{background:var(--card)}
}

<script>

// The strip's small pictures, drawn as the buttons are; never text characters. Built element by

  settings: [["path", { d: "M6.71 3.17 7.02 1.47h1.96l.31 1.7 1.21.5 1.43-.98 1.38 1.38-.98 1.43.5 1.21 1.7.31v1.96l-1.7.31-.5 1.21.98 1.43-1.38 1.38-1.43-.98-1.21.5-.31 1.7H7.02l-.31-1.7-1.21-.5-1.43.98-1.38-1.38.98-1.43-.5-1.21-1.7-.31V7.02l1.7-.31.5-1.21-.98-1.43 1.38-1.38 1.43.98z" }], ["circle", { cx: 8, cy: 8, r: 2.1 }]],
  search: [["circle", { cx: 7.2, cy: 7.2, r: 4.2 }], ["path", { d: "m10.3 10.3 3 3" }]],
  close: [["path", { d: "m4.5 4.5 7 7M11.5 4.5l-7 7" }]],

  fill: [["path", { d: "M3 6V3h3M10 3h3v3M13 10v3h-3M6 13H3v-3" }]],

  laptop: [["rect", { x: 3.5, y: 4, width: 9, height: 6.5, rx: 1 }], ["path", { d: "M2 12.5h12" }]],

function glyph(name) {

  const svg = document.createElementNS(NS, "svg");

// Draw what this part of the window shows: the side its list, the browser's toolbar the page's
// address, the bar the projects open, where the shown tab is, and (with no side) the tabs' row.
// Every name is set as text.
let barSig = null;
function S(data) {
  RUNS.clear();

  if (part === "side") return side(data);
  if (part === "docs") return void (docTabs = data.tabs, drawDocs());
  const shown = data.tabs.find((tab) => tab.key === data.shown);
  if (part === "nav") return address(shown);

  document.documentElement.toggleAttribute("data-side", sided);
  const project = data.project;
  const places = data.places || [];
  // With a side, the tabs are listed there, not in a row here.
  const tabs = sided ? [] : data.tabs.filter((tab) => ours(tab, project) && !tab.of);
  // A document of a session is shown by the session's tab.
  const lit = shown && shown.of || data.shown;

  // not lost to a title another tab changed.
  const now = JSON.stringify([sided, project, data.shown, lit, shown && [shown.key, shown.kind, shown.agent, shown.name, shown.title],
    places.map((one) => [one.key, one.name, one.folder, one.marked]), tabs.map((tab) => [tab.key, tab.title, tab.kind, tab.waits])]);

// One tab of a row of tabs: its picture, its name and its close button; `on`, the key of the one

  name.className = "n";
  name.textContent = tab.title;

  close.className = "x";
  close.title = "Close";
  close.append(glyph("close"));

  item.append(icon, name, close);

      const head = document.createElement("span");
      head.className = "h";
      head.append(icon, name);
      const about = document.createElement("span");
      about.className = "u";
      about.textContent = [several ? row.group || "—" : "", row.detail, SAID[row.state]].filter(Boolean).join(" · ");
      item.append(head, about);
      item.addEventListener("click", () => window.ipc.postMessage("visit " + row.at));
      return item;
    }));
  });

}
// The keys in an open menu: Up and Down pick a row (round the ends, from the first or the last
// when none is picked), Home and End the ends, Enter does what a click on it would, Escape closes.
// The bar's buttons are spans: each takes the keyboard's focus, says what it is, and acts on
// Return or Space as a button does.
function buttoned(node) {
  node.tabIndex = 0;
  node.setAttribute("role", "button");
}
for (const node of document.querySelectorAll(".b,.s")) buttoned(node);
document.addEventListener("keydown", (event) => {
  const node = event.target;
  if (!(node instanceof Element) || !node.matches(".b,#cr .c,.s")) return;
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    node.click();
  }
});
document.addEventListener("keydown", (event) => {
  const menu = document.getElementById("menu");
  if (!opened(menu) || event.metaKey || event.ctrlKey || event.altKey || event.target === field) return;
  const rows = picks(menu), at = rows.findIndex((node) => node.classList.contains("sel"));
  const go = (to) => {
    event.preventDefault();
    if (rows.length) choose(menu, rows[to], true);
  };
  if (event.key === "ArrowDown") go(at < 0 ? 0 : (at + 1) % rows.length);
  else if (event.key === "ArrowUp") go(at < 0 ? rows.length - 1 : (at + rows.length - 1) % rows.length);
  else if (event.key === "Home") go(0);
  else if (event.key === "End") go(rows.length - 1);
  else if (event.key === "Enter" || event.key === " ") {
    if (at < 0 || event.target.closest("button")) return;
    event.preventDefault();
    rows[at].click();
  } else if (event.key === "Escape") {
    event.preventDefault();
    window.ipc.postMessage("unmenu");
    // Focus goes back to the button that opened the menu.
    document.getElementById(menu.classList.contains("evs") ? "ev" : "hs").focus();
  }
});
// The Event Center: what waits for the person, newest first, under its button (the bar's end when
// the button waits in "»"); its dot says something new wants them. While it is `open` the list is in the menu,
// each event with its buttons, whose place is said back. Every word is set as text.
// An event says how it is shown: its section's heading and place, its tone, and what each of its
// buttons is for. The strip knows no kind of event of its own.
// The system's own colours, each its light, dark and Increase Contrast value; blue is the accent.
const TONES = { purple: "var(--purple)", blue: "var(--accent)", orange: "-apple-system-orange", red: "-apple-system-red", green: "-apple-system-green" };
function ago(at) {
  const s = Math.max(0, Date.now() / 1000 - at);
  return s < 60 ? "now" : s < 3600 ? Math.floor(s / 60) + "m" : s < 86400 ? Math.floor(s / 3600) + "h" : Math.floor(s / 86400) + "d";
}
// While the Events are open their times keep up with the clock, and nothing else is drawn again.
setInterval(() => {
  const menu = document.getElementById("menu");
  if (!opened(menu) || !menu.classList.contains("evs")) return;
  for (const item of menu.querySelectorAll(".ev")) {
    const when = item.querySelector(".w");
    if (when) when.textContent = ago(Number(item.dataset.when));
  }
}, 30000);
function V(events, open) {
  // The dot is for what wants the person and is new; what ended well is listed, quietly.
  const unseen = events.filter((event) => event.unseen && event.urgent).length;
  const bell = document.getElementById("ev");
  bell.querySelector(".d").hidden = unseen === 0;
  titled(bell, unseen ? "Show events: " + unseen + " new" : "Show events");
  bell.classList.toggle("on", open);
  if (!open) {
    if (menuSig?.[0] === "e") menuSig = null;
    return;
  }
  requestAnimationFrame(glass);
  const menu = document.getElementById("menu");
  // Flex, not block: the heading stays and the events under it scroll (.evs).
  menu.style.display = "flex";
  document.getElementById("back").style.display = "block";
  menu.classList.add("evs");
  under(menu, bell.hidden ? "end" : "ev");
  document.getElementById("hs").className = "b";
  const now = "e" + JSON.stringify(events);
  if (now === menuSig) return glass();
  redrawn(menu, "e", now, () => {
    const head = document.createElement("div");
    head.className = "evh";
    const title = document.createElement("span");
    title.textContent = "Events";
    head.append(title);
    if (events.length) {
      const clear = document.createElement("button");
      clear.className = "clr";
      clear.textContent = "Clear All";
      clear.title = "Dismiss every event: each comes back only when it changes";
      clear.addEventListener("click", () => window.ipc.postMessage("clear"));
      head.append(clear);
    }
    if (events.length === 0) return void menu.replaceChildren(head, emptied("No Events"));
    const several = new Set(events.map((event) => event.group)).size > 1;
    const list = document.createElement("div");
    list.className = "evl";
    // They come in their sections' order: a heading where a section begins.
    events.forEach((event, at) => {
      if (at === 0 || events[at - 1].rank !== event.rank) {
        const group = document.createElement("div");
        group.className = "evg";
        group.textContent = event.section + " · " + events.filter((other) => other.rank === event.rank).length;
        list.append(group);
      }
      list.append(row(event, several));
    });
    menu.replaceChildren(head, list);
  });
  glass();
}
// A row's own click opens what it is about; its one button acts on it; its x dismisses it.
function row(event, several) {
  const say = (at) => window.ipc.postMessage("event " + event.n + " " + at);
  const at = (role) => event.buttons.findIndex((button) => button.role === role);
  const item = document.createElement("div");
  // Only a row that opens something shows the hand and lights under the pointer.
  item.className = (event.unseen ? "ev new" : "ev") + (at("open") >= 0 ? " go" : "");
  item.dataset.key = event.n;
  item.dataset.when = event.at;
  item.dataset.tone = event.tone || "";
  item.style.setProperty("--hue", TONES[event.tone] || "-apple-system-gray");
  const dot = document.createElement("span");
  dot.className = "dot";
  const text = document.createElement("span");
  text.className = "tx";
  const name = document.createElement("span");
  name.className = "n";
  name.textContent = event.title || event.section;
  // An event of a terminal a coding agent runs in is the agent's: its mark leads, its name says who.
  const agent = RUNS.get(event.tab);
  if (agent) name.prepend(agentMark(agent.id));
  const words = document.createElement("span");
  words.className = "u";
  words.textContent = [event.detail, agent && agent.name, event.tab, several ? event.group : ""].filter(Boolean).join(" · ");
  text.append(name, words);
  item.title = event.detail;
  const side = document.createElement("span");
  side.className = "side";
  const when = document.createElement("span");
  when.className = "w";
  when.textContent = ago(event.at);
  // The time and the × share one place (.tm), so the row does not change as the pointer comes.
  const spot = document.createElement("span");
  spot.className = "tm";
  spot.append(when);
  if (at("open") >= 0) item.addEventListener("click", () => say(at("open")));
  if (at("act") >= 0) {
    const button = document.createElement("button");
    button.className = "act";
    button.textContent = event.buttons[at("act")].label;
    button.addEventListener("click", (e) => { e.stopPropagation(); say(at("act")); });
    side.append(button);
  }
  if (at("dismiss") >= 0) {
    const x = document.createElement("span");
    x.className = "x";
    x.title = event.buttons[at("dismiss")].label;
    x.append(glyph("close"));
    x.addEventListener("click", (e) => { e.stopPropagation(); say(at("dismiss")); });
    spot.append(x);
  }
  side.append(spot);
  item.append(dot, text, side);
  return item;
}
// The window's split (its two tabs, left and right), or whole (null): the side lists the two as
// one row.
function SP(pair) {
  if (JSON.stringify(pair) === JSON.stringify(splitPair)) return;
  splitPair = pair;
  if (document.documentElement.dataset.part === "side") drawSide();
}
// The comment button, on while the person comments on the pages, and Send while some are held.
function C(on, held) {
  const comment = document.getElementById("cm");
  comment.className = on ? "b on" : "b";
  titled(comment, on ? "Stop commenting on the page" : "Comment on the page: click what to change");
  const send = document.getElementById("sd");
  send.className = held > 0 ? "s on" : "s";
  send.textContent = "Send " + held;
  fit();
}
// Whose turn it is, said quietly in the address field: "acting" (the agent works on a page),
// "paused" (the person comments, the agent's actions wait), "waiting" (one waits now), "" (nothing).
function A(turn) {
  const words = {
    acting: ["Agent is working", "The agent is acting on a page"],
    paused: ["Paused while you comment", "The agent's actions wait while you comment. Send, or turn comments off, to let it go on"],
    waiting: ["Agent is waiting for you", "The agent wants to act and waits while you comment. Send, or turn comments off, to let it go on"],
  }[turn];
  const tn = document.getElementById("tn");
  tn.className = words ? "on" : "";
  tn.textContent = words ? words[0] : "";
  tn.title = words ? words[1] : "";
}
// The page's size, as its device's picture: lit while a size is set; the size itself is in its tip
// and in the menu (null: the page fills the window).
function F(size) {
  const fs = document.getElementById("fs");
  const kind = !size ? "fill" : size.width < 600 ? "phone" : size.width < 1000 ? "tablet" : size.width < 1400 ? "laptop" : "desktop";
  fs.replaceChildren(glyph(kind));
  fs.className = size ? "b on" : "b";
  const shown = size && size.percent < 100 ? ", shown at " + size.percent + "% to fit the window" : "";
  titled(fs, size ? "Set the page size: " + size.name + ", " + size.width + " × " + size.height + shown : "Set the page size: the window");
}
F(null);
// "Page size": the system's menu under the button (frame.rs), the sizes to pick from.
document.getElementById("fs").addEventListener("click", () => {
  const box = document.getElementById("fs").getBoundingClientRect();
  window.ipc.postMessage("frame " + Math.round(box.left) + " " + Math.round(box.bottom + 4));
});
// Buttons with no room, as Safari's: the rightmost go first into "»", whose system menu holds
// them (strip.rs's Tool), until the crumbs have room again. Only the bar's: the browser's
// toolbar keeps its few, and its address field gives way.
const TOOLS = ["ev", "hs"];
const ROOM = 160;
let fitting = 0;
function fit() {
  if (document.documentElement.dataset.part || fitting) return;
  fitting = requestAnimationFrame(() => { fitting = 0; fitBar(); });
}
function fitBar() {
  const lead = document.getElementById("lead");
  const bar = document.getElementById("bar");
  const more = document.getElementById("mo");
  for (const id of TOOLS) document.getElementById(id).hidden = false;
  more.hidden = true;
  const tight = () => lead.getBoundingClientRect().width < ROOM || bar.scrollWidth > bar.clientWidth;
  for (const id of [...TOOLS].reverse()) {
    if (!tight()) break;
    document.getElementById(id).hidden = true;
    more.hidden = false;
  }
}
new ResizeObserver(fit).observe(document.getElementById("bar"));
document.getElementById("mo").addEventListener("click", () => {
  const box = document.getElementById("mo").getBoundingClientRect();
  const held = TOOLS.filter((id) => document.getElementById(id).hidden);
  window.ipc.postMessage("more " + Math.round(box.left) + " " + Math.round(box.bottom + 4) + " " + held.join(" "));
});
// The strip's empty part moves the window, and a double click zooms it, as a titlebar does. The
// documents' row lies over the pages and is no titlebar.
for (const id of document.documentElement.dataset.part === "docs" ? [] : ["bar", "lead", "cr", "tabs", "end"]) {
  const part = document.getElementById(id);
  part.addEventListener("mousedown", (event) => {
    if (event.target === part && event.button === 0 && event.detail === 1) window.ipc.postMessage("drag");
  });
  part.addEventListener("dblclick", (event) => {
    if (event.target === part) window.ipc.postMessage("zoom");
  });
}
for (const [id, what] of [["sd", "send"], ["cm", "comment"], ["bk", "back"], ["fw", "forward"], ["hs", "history"], ["ev", "events"], ["back", "unmenu"]]) {
  document.getElementById(id).addEventListener("click", () => window.ipc.postMessage(what));
}
// No tab left, the pages' whole part offers them (`looked` draws it again as the keys change).
function blank() {
  const start = document.createElement("div");
  start.className = "start";
  for (const [id, label, message] of STARTS) {
    const button = document.createElement("button");
    const words = document.createElement("span");
    words.textContent = label;
    button.append(words);
    if (HINTS[id]) {

// The agents installed (agents.rs), told as they are found: their marks where no tab is left.
function AG(agents) {
  if (JSON.stringify(agents) === JSON.stringify(STARTED)) return;
  STARTED = agents;
  blank();
}
