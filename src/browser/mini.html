<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>llx</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;user-select:none;-webkit-user-select:none;cursor:default;font:11px/1 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
#c{position:absolute;inset:0;border-radius:12px;overflow:hidden;background:#111;color:#f2f2f2;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
#p{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block;-webkit-user-drag:none;pointer-events:none}
#p:not([src]){visibility:hidden}
.o{position:absolute;display:flex;align-items:center;gap:6px;opacity:0;transition:opacity .12s}
#c:hover .o{opacity:1}
#t{top:8px;right:8px;opacity:.85}
#l{left:8px;bottom:8px;max-width:calc(100% - 16px);padding:4px 7px;border-radius:6px;background:rgba(10,10,10,.82);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
#g{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
#i{flex:none;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.65}
button{all:unset;display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:rgba(10,10,10,.82);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:#f2f2f2;cursor:pointer}
button:hover{background:rgba(40,40,40,.92)}
button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#s{position:absolute;top:10px;left:10px;display:none;width:10px;height:10px;box-sizing:border-box;border-radius:50%;border:2px solid #f2f2f2;border-right-color:transparent;animation:r .8s linear infinite;filter:drop-shadow(0 0 2px rgba(0,0,0,.8))}
#s.on{display:block}
#h{position:absolute;inset:0;border-radius:12px;pointer-events:none;box-shadow:inset 0 0 0 3px #f2f2f2;opacity:0}
#h.on{animation:b var(--ms,700ms) ease-out}
@keyframes r{to{transform:rotate(360deg)}}
@keyframes b{0%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.o{transition:none}#s{animation:none;border-right-color:#f2f2f2}}
</style>
</head>
<body>
<div id="c">
  <img id="p" alt="" draggable="false">
  <span id="s"></span>
  <div class="o" id="t">
    <button id="x" title="Expand" aria-label="Expand"><svg viewBox="0 0 16 16"><path d="M9.5 2.5h4v4M13.5 2.5 9 7M6.5 13.5h-4v-4M2.5 13.5 7 9"/></svg></button>
  </div>
  <div class="o" id="l"><span id="g"></span><span id="i"></span></div>
  <div id="h"></div>
</div>
<script>
"use strict";
const say = (word) => window.ipc.postMessage(word);
// The shown tab's latest picture; a data: address the window made itself.
function P(src) { document.getElementById("p").src = src; }
// Which tab it is: its project and its id, set as text.
function T(tab) {
  document.getElementById("g").textContent = tab.group || "";
  document.getElementById("i").textContent = tab.id || "";
}
// The agent is acting: a spinner.
function B(on) { document.getElementById("s").className = on ? "on" : ""; }
// The agent showed a tab: one highlight.
function K(ms) {
  const h = document.getElementById("h");
  h.style.setProperty("--ms", ms + "ms");
  h.className = "";
  void h.offsetWidth;
  h.className = "on";
}
// Its button expands the window; a press anywhere else is the grip's, over the page.
document.getElementById("x").addEventListener("click", () => say("expand"));
document.addEventListener("dragstart", (e) => e.preventDefault());
</script>
</body>
</html>
