<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src {{scripts}}">
<title>{{title}}</title>
<style>{{css}}</style>
<style>
:root{--bg:#ffffff;--cursor:#1d1d1f;--mono:ui-monospace,SFMono-Regular,Menlo,Monaco,"Cascadia Code","DejaVu Sans Mono",monospace}
@media (prefers-color-scheme: dark){:root{--bg:#1e1e1e;--cursor:#e6e6e6}}
:root{--ground:var(--bg)}
/* On the window's glass (macOS) the screen is clear and the glass shows through; elsewhere, and
   where the person reduces transparency (data-reduced), it is the terminal's own ground. The strip takes no tint
   from a clear page, and the mini's picture lays it on the window's background. */
html:not([data-glass]){background:var(--bg)!important}
html[data-reduced]{background:var(--bg)!important}
body{margin:0;color:var(--fg);cursor:default}
/* The gutter is part of the terminal, so a click, drag or wheel in it reaches xterm (whose viewport
   covers it, with the arrow cursor its own sheet gives it). */
#t{position:fixed;inset:0}
.xterm{padding:8px 16px;box-sizing:border-box;height:100%}
.xterm:not(.enable-mouse-events) .xterm-viewport{cursor:text}
/* A full-screen program (vim, htop, an agent's screen) draws to the edge itself. */
html[data-alt] .xterm{padding:0 0 8px}
.xterm .xterm-viewport{background:transparent!important;overflow:hidden!important}
</style>
</head>
<body>
<div id="t"></div>
<script>{{xterm}}</script>
<script>{{glue}}</script>
</body>
</html>
