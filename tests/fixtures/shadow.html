<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Shadow</title>
</head>
<body>
  <button id="game">New Game</button>
  <!-- A consent banner as a web component: its dialog and buttons live in an open shadow root, over
       a backdrop that covers the page. -->
  <div id="consent"></div>
  <script>
    document.getElementById('game').addEventListener('click', () => { document.title = 'new game' })
    const host = document.getElementById('consent')
    const root = host.attachShadow({ mode: 'open' })
    root.innerHTML = `
      <style>
        .backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); }
        [role=dialog] { position: fixed; top: 100px; left: 100px; width: 400px; background: #fff; padding: 16px; }
      </style>
      <div class="backdrop"></div>
      <div role="dialog" aria-modal="true">
        <h2>Consent to Cookies</h2>
        <label><input type="checkbox"> Measurement</label>
        <button id="save">Save + Exit</button>
      </div>`
    root.getElementById('save').addEventListener('click', () => host.remove())
  </script>
</body>
</html>
