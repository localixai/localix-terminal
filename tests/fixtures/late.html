<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Late</title>
</head>
<body>
<!-- Results that come a while after the page loads, as from a slow server. -->
<p id="status">Searching…</p>
<script>
  setTimeout(() => { document.getElementById('status').textContent = 'Results ready: 3 found' }, 600)
</script>
</body>
</html>
