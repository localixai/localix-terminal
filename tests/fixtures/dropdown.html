<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>Dropdown</title></head>
  <body>
    <h3>Dropdown List</h3>
    <select id="dropdown">
      <option value="" disabled="disabled" selected="selected">Please select an option</option>
      <option value="1">Option 1</option>
      <option value="2">Option 2</option>
    </select>
    <script>
      // The real page's handler: it resets every option's `selected` attribute on each change.
      const dropdown = document.getElementById('dropdown')
      dropdown.onchange = (event) => {
        for (const option of dropdown.options) option.removeAttribute('selected')
        dropdown.querySelector(`option[value='${event.target.value}']`).setAttribute('selected', 'selected')
      }
    </script>
  </body>
</html>
