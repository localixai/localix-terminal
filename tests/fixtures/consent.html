<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>Quiz</title></head>
  <body>
    <!-- A consent banner written by a script into an iframe with no address of its own, over the
         whole page, as FastCMP does on w3schools.com. -->
    <form action="/second.html">
      <label><input type="radio" name="a" value="1" /> &lt;script&gt;</label>
      <label><input type="radio" name="a" value="2" /> &lt;js&gt;</label>
      <button>Next</button>
    </form>
    <div id="cmp" style="position: fixed; inset: 0; z-index: 2147483647">
      <iframe title="Consent" style="width: 100%; height: 100%; border: 0"></iframe>
    </div>
    <script>
      const doc = document.querySelector('#cmp iframe').contentDocument
      doc.body.innerHTML = '<p>We value your privacy</p><input id="mail" aria-label="Mail">' +
        '<button id="ok" value="all">Accept</button>'
      doc.getElementById('ok').addEventListener('click', () => {
        document.title = `Quiz:${doc.getElementById('mail').value}`
        document.getElementById('cmp').remove()
      })
    </script>
  </body>
</html>
