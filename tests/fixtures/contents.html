<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Contents</title>
  <style>
    /* A framework's mount point: it has no box of its own (display: contents), its children do. */
    #root { display: contents }
    main { padding: 20px }
  </style>
</head>
<body>
  <div id="root">
    <header><a href="/second.html">Docs</a></header>
    <main>
      <h1>Mounted by script</h1>
      <button id="go">Get started</button>
    </main>
  </div>
</body>
</html>
