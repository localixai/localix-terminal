<!doctype html>
<meta charset="utf-8">
<title>Elsewhere</title>
<h1>Elsewhere</h1>
<!-- An external frame: a tab's rule is for the page itself, never for what it embeds. -->
<iframe src="http://192.0.2.1/frame" title="external frame"></iframe>
<p><a href="http://192.0.2.1/link">External link</a></p>
<button type="button" onclick="setTimeout(() => { location.href = 'http://192.0.2.1/later' }, 1500)">Go later</button>
