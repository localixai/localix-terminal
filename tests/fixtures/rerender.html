<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>apples:0 pears:0</title>
</head>
<body>
<!-- Every click renders the whole list again, as a framework does: each button is a new node,
     with the same role and name as the one it replaced. "Grow" adds a row, so an old ref's place
     among its equals no longer says which button it was. -->
<main id="app"></main>
<script>
  const counts = { apples: 0, pears: 0 }
  const rows = ['apples', 'pears']
  function render() {
    document.getElementById('app').innerHTML = rows.map((row) =>
      `<p>${row}: ${counts[row] ?? 0} <button type="button" data-row="${row}">Add one</button></p>`
    ).join('') + '<button type="button" id="grow">Grow</button>'
    document.title = rows.map((row) => `${row}:${counts[row] ?? 0}`).join(' ')
  }
  document.getElementById('app').addEventListener('click', (event) => {
    const row = event.target.dataset?.row
    if (row) counts[row] = (counts[row] ?? 0) + 1
    if (event.target.id === 'grow') rows.unshift('plums')
    render()
  })
  render()
</script>
</body>
</html>
