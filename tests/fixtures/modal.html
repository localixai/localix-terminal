<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>Modal</title></head>
  <body>
    <!-- A date picker's modal hides the form behind it from assistive tech, as Google Flights does. -->
    <main aria-hidden="true">
      <label>Where from? <input value="Larnaca" /></label>
      <label>Password <input type="password" value="secret" /></label>
    </main>
    <div role="dialog" aria-modal="true"><button>Done</button></div>
  </body>
</html>
