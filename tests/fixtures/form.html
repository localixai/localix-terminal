<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Book</title>
    <style>
      #veil { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: none }
    </style>
  </head>
  <body>
    <h1>Book a trip</h1>
    <form id="trip">
      <label>City <input id="city" required /></label>
      <select id="cls" aria-label="Class">
        <option>Economy</option>
        <option>Business</option>
      </select>
      <button type="button" disabled>Later</button>
      <button>Search</button>
    </form>
    <button id="veiled" onclick="document.title = 'veiled clicked'">Under the veil</button>
    <button type="button" onclick="document.getElementById('veil').style.display = 'block'">
      Raise veil
    </button>
    <div id="veil"></div>
    <p><a href="/second.html">Next page</a></p>
    <dialog open>
      <p>Cookies?</p>
      <button onclick="this.closest('dialog').close()">Accept</button>
    </dialog>
    <script>
      // Records what the form received, the way a React app's handler would read it.
      document.getElementById('trip').addEventListener('submit', (event) => {
        event.preventDefault()
        document.title = `sent:${city.value}:${cls.value}`
      })
    </script>
  </body>
</html>
