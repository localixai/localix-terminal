<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tabs</title>
</head>
<body>
  <!-- Both open a new window: a browser opens a tab for each. -->
  <a href="/second.html" target="_blank">Open second</a>
  <button onclick="window.open('/dropdown.html')">Open dropdown</button>
  <!-- A sign-in popup: a window the page keeps a handle on, answering it through window.opener. -->
  <button onclick="window.open('/popup.html', 'signin', 'width=400,height=500')">Sign in</button>
  <script>
    // Counts animation frames: a tab out of sight must keep drawing.
    window.frames_drawn = 0
    const frame = () => { window.frames_drawn++; requestAnimationFrame(frame) }
    requestAnimationFrame(frame)
    addEventListener("message", (event) => { if (event.data === "signed in") document.title = "Signed in" })
  </script>
</body>
</html>
