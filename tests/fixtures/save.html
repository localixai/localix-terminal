<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Settings</title>
  </head>
  <body>
    <h1>Settings</h1>
    <nav>
      <a href="#profile">Profile</a>
      <a href="#billing">Billing</a>
      <a href="#team">Team</a>
    </nav>
    <form id="settings">
      <label>Name <input id="name" value="Ada" /></label>
      <label>Email <input id="email" type="email" value="ada@example.com" /></label>
      <label>Time zone
        <select id="zone">
          <option>UTC</option>
          <option>Europe/Paris</option>
        </select>
      </label>
      <label><input type="checkbox" checked /> Weekly digest</label>
      <button type="button" id="cancel">Cancel</button>
      <button type="button" id="save">Save</button>
      <button type="button">Save draft</button>
    </form>
    <p role="status" id="status"></p>
    <script>
      // The form sent (Enter in a field sends it) says so and stays, as an app's handler would.
      document.getElementById('settings').addEventListener('submit', (event) => {
        event.preventDefault()
        document.getElementById('status').textContent = 'Sent'
      })
      // A save that takes a moment, as a real one would, and says so when it is done.
      document.getElementById('save').addEventListener('click', () => {
        setTimeout(() => {
          document.getElementById('status').textContent = 'Saved'
        }, 300)
      })
    </script>
  </body>
</html>
