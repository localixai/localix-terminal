<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>Leave</title></head>
  <body>
    <!-- Navigations no click or submit listener sees: a script submits the form (no submit event),
         or assigns the location a moment after the click. Only the Navigation API reports them. -->
    <form id="f" method="post" action="/slow/second.html"></form>
    <button onclick="document.getElementById('f').submit()">Submit by script</button>
    <button onclick="setTimeout(() => location.assign('/slow/second.html'), 40)">Go later</button>
  </body>
</html>
