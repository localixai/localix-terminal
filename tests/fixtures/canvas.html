<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Canvas</title>
  <style>
    body { margin: 0; background: #fff; }
    canvas { display: block; }
    /* Below the fold: a crop to it scrolls it into view first. */
    #board { margin: 1400px 40px; width: 200px; height: 100px; background: #c00; }
  </style>
</head>
<body>
  <!-- A game board drawn on a canvas: its tiles are pixels, not text. -->
  <canvas id="game" width="300" height="150"></canvas>
  <div id="board"></div>
  <script>
    const context = document.getElementById('game').getContext('2d')
    context.fillStyle = '#0a0'
    context.fillRect(0, 0, 300, 150)
    context.fillStyle = '#fff'
    context.font = '48px sans-serif'
    context.fillText('2048', 90, 95)
  </script>
</body>
</html>
