<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>Calendar</title></head>
  <body>
    <!-- Two months at once, as date pickers show them: only the month tells the 5ths apart. -->
    <div role="grid"><div role="rowgroup"><div>December</div>
      <div role="row"><div role="gridcell" data-iso="2026-12-05"><div role="button">5</div></div></div>
    </div></div>
    <table><caption>January 2027</caption>
      <tr><td><button>5 €120</button></td></tr>
    </table>
  </body>
</html>
