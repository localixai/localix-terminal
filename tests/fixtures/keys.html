<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>keys:</title></head>
  <body>
    <script>
      // Records what a game reads from each key: key, code and the legacy keyCode.
      document.addEventListener('keydown', (e) => { document.title += `${e.key}/${e.code}/${e.keyCode};` })
    </script>
  </body>
</html>
