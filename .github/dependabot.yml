# Weekly pull requests that move the workflows' pinned actions (by commit) and Cargo.lock to new
# releases. CI does not run on a pull request: run it by hand on the branch before merging.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
