# A release from a tag (v0.1.0): the app, which is all there is to install. On macOS LLX Desk.app
# (for Apple silicon, the Claude Code plugin inside), signed with the project's
# Developer ID and notarized by Apple, as a disk image (LLX-Desk-macos.dmg) and as the zip that
# install.sh fetches (LLX-Desk-macos.zip), built on GitHub's Mac runner by scripts/dmg.sh; on Linux
# the program and its licence, built on the project's own runner, whose system is Ubuntu 22.04: the
# job checks that the program needs no newer glibc than 2.35. SHA256SUMS lists them all, and
# install.sh checks against it; each file also carries a build provenance attestation (`gh
# attestation verify FILE -R rsaryev/llx-desk`). The notes are the CHANGELOG.md section of that
# version.
#
# Releases build with one exact Rust (RUSTUP_TOOLCHAIN below), so a tag built again builds the
# same; development and CI take the latest stable from rust-toolchain.toml. Move it on by hand
# once CI passed on a newer stable.
#
# Nothing is built before the gate: the tag is on main and CI passed for its commit. The Apple
# secrets belong to the `release` environment (its branches and tags: main and v*) and to the macos
# job alone, which runs on GitHub's runner: the self-hosted runner never sees them.
#
# Run by hand (workflow_dispatch) it is a dry run: the same builds, the same signing and
# notarization, and the files stay on the run as artifacts. Only a tag publishes.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency: release-${{ github.ref }}

env:
  # Empty on a dry run, which has no tag for scripts/check-versions.sh to compare.
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  # Over rust-toolchain.toml's `stable`, for every cargo and rustup call of the builds.
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  gate:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: CI is green for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        # Any run of CI for the commit that succeeded; one still running is waited for (up to 20
        # minutes), so a tag pushed right after the merge passes.
        run: |
          for attempt in $(seq 1 40); do
            runs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
              --json conclusion,status)
            [ "$(jq 'map(select(.conclusion == "success")) | length' <<<"$runs")" -eq 0 ] || exit 0
            running=$(jq 'map(select(.status != "completed")) | length' <<<"$runs")
            total=$(jq 'length' <<<"$runs")
            # No run yet is given a minute or two to start.
            if [ "$running" -eq 0 ] && { [ "$total" -gt 0 ] || [ "$attempt" -ge 4 ]; }; then break; fi
            sleep 30
          done
          echo "CI for $GITHUB_SHA did not succeed: $(jq -c 'map(.conclusion // .status)' <<<"$runs")"
          exit 1

  linux:
    needs: gate
    if: ${{ !cancelled() && needs.gate.result != 'failure' }}
    runs-on: [self-hosted, linux, x64, llx-desk]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-versions.sh ${TAG:+"$TAG"}
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - run: cargo build --release --locked
      - name: No newer glibc than 2.35
        run: |
          newest=$(objdump -T target/release/llx-desk | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
          echo "needs $newest"
          [ "$(printf '%s\n' "$newest" GLIBC_2.35 | sort -V | tail -n 1)" = GLIBC_2.35 ]
      - run: scripts/package.sh target/release/llx-desk x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: x86_64-unknown-linux-gnu
          path: dist/*.tar.gz

  macos:
    needs: gate
    if: ${{ !cancelled() && needs.gate.result != 'failure' }}
    runs-on: macos-latest
    environment: release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-versions.sh ${TAG:+"$TAG"}
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      # Every dependency's build script and macro runs here, before the signing key, the notary's
      # key or any secret is on this machine; scripts/dmg.sh's own build then finds it all built.
      # The target is Info.plist's minimum, which dmg.sh sets the same way.
      - name: Build the program
        run: MACOSX_DEPLOYMENT_TARGET=$(plutil -extract LSMinimumSystemVersion raw packaging/macos/Info.plist) cargo build --release --locked
      - name: The Apple secrets are all there
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_B64; do
            if [ -z "${!name}" ]; then
              echo "$name is not set in the release environment" >&2
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          team="${APPLE_SIGNING_IDENTITY##*(}"
          team="${team%)}"
          [[ "$team" =~ ^[A-Z0-9]{10}$ ]] || { echo "No team ID in APPLE_SIGNING_IDENTITY" >&2; exit 1; }
      - name: Decode the App Store Connect key
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
      # A keychain of its own, put first in the search list and taken out of it again when the job
      # ends; the list as it was is saved, and the runner's keychains are never replaced.
      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          CERTIFICATE_PATH="$RUNNER_TEMP/llx-desk-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/llx-desk-signing.keychain-db"
          KEYCHAIN_LIST_PATH="$RUNNER_TEMP/llx-desk-keychain-search-list.txt"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security list-keychains -d user | tr -d '"' | sed 's/^[[:space:]]*//' > "$KEYCHAIN_LIST_PATH"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # -x: the private key can sign but never be exported again.
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -x \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F -- "$APPLE_SIGNING_IDENTITY"
          # Keychain paths contain no spaces; splitting the list into arguments is intended.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
      - name: Build, sign and notarize LLX Desk.app and its disk image
        env:
          LLX_DESK_SIGN: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: scripts/dmg.sh --notarize --out dist
      # What Gatekeeper decides on a user's Mac, asked again of the files that go up: the disk image,
      # the app inside it and the app in the zip are signed by this team, hold a stapled ticket, and
      # Gatekeeper accepts them. A signature that fell back to ad hoc fails here.
      - name: Verify the signature and the notarization
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          team="${APPLE_SIGNING_IDENTITY##*(}"
          team="${team%)}"
          dmg=dist/LLX-Desk-macos.dmg
          mount="$RUNNER_TEMP/dmg-check"
          unzipped="$RUNNER_TEMP/zip-check"
          mkdir -p "$mount" "$unzipped"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mount" "$dmg" >/dev/null
          trap 'hdiutil detach "$mount" >/dev/null || true' EXIT
          ditto -x -k dist/LLX-Desk-macos.zip "$unzipped"
          codesign --verify --strict --verbose=2 "$dmg"
          codesign --verify --deep --strict --verbose=2 "$mount/LLX Desk.app"
          codesign --verify --deep --strict --verbose=2 "$unzipped/LLX Desk.app"
          for target in "$dmg" "$mount/LLX Desk.app" "$unzipped/LLX Desk.app"; do
            codesign -dv "$target" 2>&1 | grep -qx "TeamIdentifier=$team" ||
              { echo "$target is not signed by team $team" >&2; exit 1; }
            # Apple's CloudKit drops a hosted runner's connection now and then.
            for attempt in 1 2 3 4; do
              xcrun stapler validate "$target" && break
              [ "$attempt" = 4 ] && exit 1
              sleep 30
            done
          done
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          spctl --assess --type execute --verbose=2 "$mount/LLX Desk.app"
          # install.sh holds a downloaded app to the team its TEAM_ID names: the one that signs.
          pinned=$(sed -n 's/^TEAM_ID=\([A-Z0-9]*\)$/\1/p' install.sh)
          if [ -z "$pinned" ]; then
            echo "::warning::install.sh has no TEAM_ID: set it to $team to pin the signing team"
          elif [ "$pinned" != "$team" ]; then
            echo "install.sh's TEAM_ID is $pinned, but the release is signed by team $team" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-darwin
          path: |
            dist/LLX-Desk-macos.dmg
            dist/LLX-Desk-macos.zip
      - name: Remove the signing material
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/llx-desk-signing.keychain-db"
          KEYCHAIN_LIST_PATH="$RUNNER_TEMP/llx-desk-keychain-search-list.txt"
          if [ -s "$KEYCHAIN_LIST_PATH" ]; then
            ORIGINAL_KEYCHAINS=()
            while IFS= read -r keychain; do
              ORIGINAL_KEYCHAINS+=("$keychain")
            done < "$KEYCHAIN_LIST_PATH"
            security list-keychains -d user -s "${ORIGINAL_KEYCHAINS[@]}" || true
          fi
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f \
            "$RUNNER_TEMP/llx-desk-signing.p12" \
            "$RUNNER_TEMP/apple-api-key.p8" \
            "$KEYCHAIN_LIST_PATH"

  release:
    needs: [linux, macos]
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.linux.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # The build provenance attestation: a token to sign it with, and where it is kept.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # Computed here, after the download, so the sums are those of the files as they are published.
      - name: Every archive, and its checksum
        run: |
          cd dist
          for file in llx-desk-x86_64-unknown-linux-gnu.tar.gz LLX-Desk-macos.zip LLX-Desk-macos.dmg; do
            [ -s "$file" ] || { echo "missing $file"; exit 1; }
          done
          sha256sum llx-desk-*.tar.gz LLX-Desk-macos.zip LLX-Desk-macos.dmg > SHA256SUMS
          cat SHA256SUMS
      # Which workflow run, commit and tag made each file, signed for the repository.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      # The notes: the version's section of CHANGELOG.md (its bold-led entries, a first plain line
      # summing it up when there is one), then where to get it and how to check it.
      - name: Notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '$0 == "## " v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > section.md
          [ -s section.md ] || { echo "CHANGELOG.md has no section \"## $version\""; exit 1; }
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          {
            cat section.md
            echo
            echo "### Download"
            echo
            echo "- **macOS 12+, Apple silicon:** [LLX-Desk-macos.dmg]($base/LLX-Desk-macos.dmg), signed and notarized. Open it and drag LLX Desk to Applications."
            echo "- **Linux x86_64 (glibc 2.35+):** [llx-desk-x86_64-unknown-linux-gnu.tar.gz]($base/llx-desk-x86_64-unknown-linux-gnu.tar.gz)"
            echo "- **Either, from a terminal:** \`curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | sh\`"
            echo
            echo "Checksums are in [SHA256SUMS]($base/SHA256SUMS)."
          } > notes.md
      # A run that is repeated finds the draft or the release there and puts the files in it again.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "LLX Desk ${GITHUB_REF_NAME#v}" \
              --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/llx-desk-*.tar.gz dist/LLX-Desk-macos.zip \
            dist/LLX-Desk-macos.dmg dist/SHA256SUMS --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
