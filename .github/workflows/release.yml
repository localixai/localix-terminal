# A release from a tag (v0.1.0): the Linux build on the project's own runner, an Ubuntu 22.04
# container (glibc 2.35 at most); both Mac builds on GitHub's Mac runner (free for a public
# repository), the Intel one cross-compiled. Each archive holds the program and its
# licence; SHA256SUMS lists them, and the plugin's launcher and install.sh check against it. The notes
# are the CHANGELOG.md section of that version.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency: release-${{ github.ref }}

jobs:
  linux:
    runs-on: [self-hosted, linux, x64, llx-desk]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-versions.sh "$GITHUB_REF_NAME"
      - run: cargo build --release --locked
      - name: No newer glibc than 2.35
        run: |
          newest=$(objdump -T target/release/llx-desk | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
          echo "needs $newest"
          [ "$(printf '%s\n' "$newest" GLIBC_2.35 | sort -V | tail -n 1)" = GLIBC_2.35 ]
      - run: scripts/package.sh target/release/llx-desk x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-unknown-linux-gnu
          path: dist/*.tar.gz

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-versions.sh "$GITHUB_REF_NAME"
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build both Mac targets
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target"
            scripts/package.sh "target/$target/release/llx-desk" "$target"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: apple-darwin
          path: dist/*.tar.gz

  release:
    needs: [linux, macos]
    runs-on: [self-hosted, linux, x64, llx-desk]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Every archive, and its checksum
        run: |
          cd dist
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            [ -s "llx-desk-$target.tar.gz" ] || { echo "missing llx-desk-$target.tar.gz"; exit 1; }
          done
          sha256sum llx-desk-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '$0 == "## " v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section \"## $version\""; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md dist/llx-desk-*.tar.gz dist/SHA256SUMS
