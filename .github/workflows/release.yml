# A release from a tag (v0.1.0): the app, which is all there is to install. On macOS LLX Desk.app
# (one universal program for both Macs, the Claude Code plugin inside), built on GitHub's Mac
# runner; on Linux the program and its licence, built on the project's own runner in an Ubuntu
# 22.04 container (glibc 2.35 at most). SHA256SUMS lists both, and install.sh checks against it.
# The notes are the CHANGELOG.md section of that version.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency: release-${{ github.ref }}

jobs:
  linux:
    runs-on: [self-hosted, linux, x64, llx-desk]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-versions.sh "$GITHUB_REF_NAME"
      - run: cargo build --release --locked
      - name: No newer glibc than 2.35
        run: |
          newest=$(objdump -T target/release/llx-desk | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
          echo "needs $newest"
          [ "$(printf '%s\n' "$newest" GLIBC_2.35 | sort -V | tail -n 1)" = GLIBC_2.35 ]
      - run: scripts/package.sh target/release/llx-desk x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-unknown-linux-gnu
          path: dist/*.tar.gz

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-versions.sh "$GITHUB_REF_NAME"
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: LLX Desk.app, for both Macs
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target"
          done
          mkdir -p target/universal dist
          lipo -create -output target/universal/llx-desk \
            target/aarch64-apple-darwin/release/llx-desk target/x86_64-apple-darwin/release/llx-desk
          app=$(scripts/bundle-macos.sh target/universal/llx-desk target/universal/bundle)
          ditto -c -k --keepParent "$app" dist/LLX-Desk-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: apple-darwin
          path: dist/LLX-Desk-macos.zip

  release:
    needs: [linux, macos]
    runs-on: [self-hosted, linux, x64, llx-desk]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Every archive, and its checksum
        run: |
          cd dist
          for file in llx-desk-x86_64-unknown-linux-gnu.tar.gz LLX-Desk-macos.zip; do
            [ -s "$file" ] || { echo "missing $file"; exit 1; }
          done
          sha256sum llx-desk-*.tar.gz LLX-Desk-macos.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '$0 == "## " v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section \"## $version\""; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md dist/llx-desk-*.tar.gz dist/LLX-Desk-macos.zip dist/SHA256SUMS
