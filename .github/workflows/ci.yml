# The checks of CONTRIBUTING.md on every push to main: on the project's own runners for Linux, which
# are self-hosted, and on GitHub's Mac runner for the code that is macOS's. The repository is public,
# so nothing here runs for a pull request: a fork's code never reaches the self-hosted runners.
# workflow_dispatch runs the checks on any branch, before it is merged.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, linux, x64, llx-desk]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-versions.sh
      - run: sh -n install.sh && sh -n plugins/claude-code/bin/llx-desk
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  msrv:
    runs-on: [self-hosted, linux, x64, llx-desk]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo check on the rust-version of Cargo.toml
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          cargo "+$msrv" check --locked --all-targets

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Dependencies and the build, kept between runs of GitHub's runner by Cargo.lock and the
      # toolchain; the self-hosted runners keep theirs on disk.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny,shellcheck
      - run: scripts/check-versions.sh
      - run: shellcheck install.sh scripts/*.sh plugins/claude-code/bin/llx-desk
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: bun test src/browser plugins/claude-code/hooks
      # Advisories, licences and sources of the dependency tree, as deny.toml says.
      - run: cargo deny --locked check
      - name: The app bundles and its signature holds (ad hoc, nothing is notarized)
        run: |
          cargo build --locked
          app=$(scripts/bundle-macos.sh target/debug/llx-desk target/smoke)
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -archs "$app/Contents/MacOS/llx-desk"
