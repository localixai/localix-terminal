# What `cargo deny check` holds the dependency tree to, in CI: no crate with a security advisory
# against it, only the licences listed here (each one compatible with this crate's MIT), and
# crates from crates.io alone. Two versions of one crate are reported, not refused: the tree
# takes them from its dependencies, and they cost build time, not correctness.

[graph]
# The platforms releases are built for; a crate only another platform takes is not checked.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"
# An unmaintained crate is refused among this crate's own dependencies; one deeper in the tree
# (GTK's macros, on Linux) is the dependency's to replace.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

# The terminal core's build script (ghostty-vt-sys) fetches libghostty-vt's release over HTTPS:
# with the system's TLS on macOS, and with rustls on Linux. These crates are build dependencies
# of that script alone and never in the program; each licence is allowed for its crate alone.
# The root certificates the fetch trusts (Mozilla's list), under the CDLA's permissive terms.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# rustls's cryptography and certificate checks, ISC.
[[licenses.exceptions]]
crate = "ring"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "rustls-webpki"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "untrusted"
allow = ["ISC"]

# Constant-time comparisons under rustls, BSD-3-Clause.
[[licenses.exceptions]]
crate = "subtle"
allow = ["BSD-3-Clause"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
