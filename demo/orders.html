<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders</title>
<link rel="stylesheet" href="kit.css">
<style>
  .tools {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 12rem;
    gap: 0.75rem;
    margin: 1rem 0 0.75rem;
  }
  .table {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-panel);
    overflow-x: auto;
  }
  table {
    min-width: 40rem;
  }
  th,
  td {
    padding-block: 0.45rem;
  }
  tbody tr:last-child td {
    border-bottom: 0;
  }
  tbody tr:hover {
    background: var(--sunk);
  }
  th button {
    all: unset;
    cursor: pointer;
    display: inline-flex;
    gap: 0.3rem;
    align-items: center;
  }
  th button:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }
  th[aria-sort] .mark {
    color: var(--ink);
  }
  td button.link {
    all: unset;
    cursor: pointer;
    color: var(--accent);
    font-weight: 550;
  }
  td button.link:focus-visible {
    outline: 2px solid var(--focus);
    border-radius: 4px;
  }
  .status-Paid {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .status-Pending {
    color: var(--warn);
  }
  .status-Refunded {
    background: var(--danger-soft);
    color: var(--danger);
  }
  .pages {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 1rem;
  }
  dialog dl {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.35rem 1rem;
    margin: 0 0 1rem;
  }
  dialog dt {
    color: var(--muted);
  }
  dialog dd {
    margin: 0;
  }
  dialog ul {
    padding-left: 1.1rem;
    margin: 0 0 1.25rem;
  }
  @media (max-width: 40rem) {
    .tools {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<main>
  <h1>Orders</h1>
  <p class="lead" style="margin: 0">Every order from the autumn season, newest first.</p>
  <div class="tools">
    <div class="field">
      <label class="sr-only" for="search">Search by customer, city or order number</label>
      <input id="search" type="search" placeholder="Search by customer, city or order number">
    </div>
    <div class="field">
      <label class="sr-only" for="status">Status</label>
      <select id="status">
        <option value="">Every status</option>
        <option>Paid</option>
        <option>Shipped</option>
        <option>Pending</option>
        <option>Refunded</option>
      </select>
    </div>
  </div>
  <div class="table">
    <table>
      <caption class="sr-only">Orders</caption>
      <thead><tr id="heads"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="pages">
    <span class="small muted" id="range" aria-live="polite"></span>
    <div class="row">
      <button type="button" id="prev">Previous</button>
      <span class="small" id="page"></span>
      <button type="button" id="next">Next</button>
    </div>
  </div>
</main>

<dialog id="details" aria-labelledby="details-title">
  <h2 id="details-title"></h2>
  <dl id="details-list"></dl>
  <ul id="details-items"></ul>
  <form method="dialog"><button class="primary">Close</button></form>
</dialog>

<script src="kit.js"></script>
<script>
  header("Orders");
  const random = seeded(20261);
  const FIRST = ["Ana", "Ben", "Chloe", "Dmitri", "Elif", "Farid", "Grace", "Hugo", "Ines", "Jonas", "Kaya", "Liam", "Maya", "Nils", "Olga", "Priya", "Quinn", "Rosa", "Sami", "Tess"];
  const LAST = ["Alvarez", "Brandt", "Costa", "Dubois", "Eriksen", "Fischer", "Garcia", "Haddad", "Ivanova", "Jensen", "Kowalski", "Lindqvist", "Moreau", "Nakamura", "Okafor", "Petrov"];
  const CITIES = ["Lisbon", "Porto", "Lyon", "Ghent", "Malmo", "Krakow", "Leipzig", "Turin", "Bergen", "Tartu"];
  const STATUSES = ["Paid", "Paid", "Shipped", "Shipped", "Shipped", "Pending", "Refunded"];
  const GOODS = [["Linen apron", 34], ["Clay pot, large", 28], ["Watering can", 22], ["Seed set", 12], ["Pruning shears", 41], ["Garden gloves", 15], ["Bulb mix", 18]];
  const ORDERS = Array.from({ length: 60 }, (_, n) => {
    const left = [...GOODS];
    const items = Array.from({ length: 1 + Math.floor(random() * 3) }, () => {
      const [[name, price]] = left.splice(Math.floor(random() * left.length), 1);
      return { name, price, qty: 1 + Math.floor(random() * 3) };
    });
    const day = new Date(Date.UTC(2026, 9, 31) - n * 86400000 * (0.5 + random()));
    return {
      id: 1060 - n,
      customer: `${pick(random, FIRST)} ${pick(random, LAST)}`,
      city: pick(random, CITIES),
      status: pick(random, STATUSES),
      date: day.toISOString().slice(0, 10),
      items,
      total: items.reduce((sum, i) => sum + i.price * i.qty, 0),
    };
  });
  const COLUMNS = [
    ["id", "Order"],
    ["date", "Date"],
    ["customer", "Customer"],
    ["city", "City"],
    ["status", "Status"],
    ["total", "Total"],
  ];
  const PER_PAGE = 10;
  let sort = { key: "date", up: false };
  let page = 0;
  const $ = (id) => document.getElementById(id);

  function heads() {
    $("heads").innerHTML = COLUMNS.map(([key, name]) => {
      const sorted = sort.key === key;
      const aria = sorted ? ` aria-sort="${sort.up ? "ascending" : "descending"}"` : "";
      const mark = sorted ? (sort.up ? "▲" : "▼") : "";
      return `<th${aria} class="${key === "total" ? "num" : ""}" scope="col"><button type="button" data-key="${key}">${name}<span class="mark" aria-hidden="true">${mark}</span></button></th>`;
    }).join("");
  }

  function shown() {
    const words = $("search").value.trim().toLowerCase().replace(/^#/, "");
    const status = $("status").value;
    const found = ORDERS.filter(
      (o) => (!status || o.status === status) && (!words || `${o.id} ${o.customer} ${o.city}`.toLowerCase().includes(words)),
    );
    const sign = sort.up ? 1 : -1;
    return found.sort((a, b) => {
      const x = a[sort.key];
      const y = b[sort.key];
      return sign * (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) || b.id - a.id;
    });
  }

  function draw() {
    const all = shown();
    const pages = Math.max(1, Math.ceil(all.length / PER_PAGE));
    page = Math.min(page, pages - 1);
    const rows = all.slice(page * PER_PAGE, (page + 1) * PER_PAGE);
    $("rows").innerHTML = rows.length
      ? rows
          .map(
            (o) => `<tr><td><button type="button" class="link" data-id="${o.id}">#${o.id}</button></td><td>${o.date}</td>
              <td>${o.customer}</td><td>${o.city}</td><td><span class="pill status-${o.status}">${o.status}</span></td>
              <td class="num">${money.format(o.total)}</td></tr>`,
          )
          .join("")
      : `<tr><td colspan="6" class="muted">No orders match. Clear the search or pick another status.</td></tr>`;
    $("range").textContent = all.length
      ? `${page * PER_PAGE + 1} to ${page * PER_PAGE + rows.length} of ${all.length} orders`
      : "0 orders";
    $("page").textContent = `Page ${page + 1} of ${pages}`;
    $("prev").disabled = page === 0;
    $("next").disabled = page >= pages - 1;
  }

  $("heads").addEventListener("click", (event) => {
    const key = event.target.closest("button")?.dataset.key;
    if (!key) return;
    sort = { key, up: sort.key === key ? !sort.up : key !== "date" && key !== "total" };
    heads();
    draw();
    $("heads").querySelector(`[data-key="${key}"]`).focus();
  });
  $("search").addEventListener("input", () => ((page = 0), draw()));
  $("status").addEventListener("change", () => ((page = 0), draw()));
  $("prev").addEventListener("click", () => (page--, draw()));
  $("next").addEventListener("click", () => (page++, draw()));

  $("rows").addEventListener("click", (event) => {
    const id = Number(event.target.closest("[data-id]")?.dataset.id);
    const order = ORDERS.find((o) => o.id === id);
    if (!order) return;
    $("details-title").textContent = `Order #${order.id}`;
    $("details-list").innerHTML = `<dt>Customer</dt><dd>${order.customer}</dd><dt>City</dt><dd>${order.city}</dd>
      <dt>Date</dt><dd>${order.date}</dd><dt>Status</dt><dd>${order.status}</dd><dt>Total</dt><dd>${money.format(order.total)}</dd>`;
    $("details-items").innerHTML = order.items.map((i) => `<li>${i.qty} × ${i.name}, ${money.format(i.price)} each</li>`).join("");
    $("details").showModal();
  });

  heads();
  draw();
</script>
</body>
</html>
