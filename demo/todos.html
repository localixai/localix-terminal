<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This week</title>
<link rel="stylesheet" href="kit.css">
<style>
  .list > * {
    max-width: 40rem;
  }
  .add {
    display: flex;
    gap: 0.5rem;
    margin: 1.5rem 0 1rem;
  }
  .items {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-panel);
  }
  .items li {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    align-items: center;
    gap: 0.75rem;
    padding: 0.55rem 0.75rem 0.55rem 1rem;
    min-height: 3.25rem;
  }
  .items li + li {
    border-top: 1px solid var(--line);
  }
  .items li.done .text {
    color: var(--muted);
    text-decoration: line-through;
  }
  .items .text {
    overflow-wrap: anywhere;
  }
  .items input.rename {
    min-height: 2.25rem;
    padding: 0.3rem 0.6rem;
  }
  .items button {
    min-height: 2.25rem;
    padding: 0 0.7rem;
    font-size: var(--step--1);
  }
  .items .empty {
    display: block;
    color: var(--muted);
    padding: 1.5rem 1rem;
  }
  .foot {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1rem;
  }
</style>
</head>
<body>
<main class="list">
  <h1>This week</h1>
  <p class="lead">What is left to do before Sunday.</p>
  <form class="add" id="add">
    <label class="sr-only" for="new">New task</label>
    <input id="new" placeholder="Add a task and press Enter" autocomplete="off">
    <button class="primary" type="submit">Add</button>
  </form>
  <ul class="items" id="items" aria-label="Tasks"></ul>
  <div class="foot">
    <span id="left" aria-live="polite"></span>
    <div class="chips" role="group" aria-label="Show" id="filters">
      <button type="button" aria-pressed="true">All</button>
      <button type="button" aria-pressed="false">Active</button>
      <button type="button" aria-pressed="false">Done</button>
    </div>
    <button type="button" class="quiet" id="clear">Clear done</button>
  </div>
</main>
<script src="kit.js"></script>
<script>
  header("Todos");
  let next = 1;
  const item = (text, done = false) => ({ id: next++, text, done });
  let items = [
    item("Repot the basil"),
    item("Return library books", true),
    item("Call the plumber about the kitchen tap"),
    item("Buy oat milk and coffee beans"),
    item("Write to Grandma", true),
    item("Book the dentist for March"),
  ];
  let filter = "All";
  let editing = null;
  const $ = (id) => document.getElementById(id);

  function draw() {
    const shown = items.filter((i) => filter === "All" || (filter === "Done") === i.done);
    $("items").innerHTML = shown.length
      ? shown
          .map((i) =>
            i.id === editing
              ? `<li data-id="${i.id}"><input type="checkbox" disabled ${i.done ? "checked" : ""} aria-label="Done">
                  <input class="rename" value="${esc(i.text)}" aria-label="Rename ${esc(i.text)}">
                  <button type="button" data-save>Save</button><button type="button" data-cancel class="quiet">Cancel</button></li>`
              : `<li data-id="${i.id}" class="${i.done ? "done" : ""}">
                  <input type="checkbox" id="t${i.id}" ${i.done ? "checked" : ""}>
                  <label class="text" for="t${i.id}" style="font-weight: 450">${esc(i.text)}</label>
                  <button type="button" class="quiet" data-edit aria-label="Edit ${esc(i.text)}">Edit</button>
                  <button type="button" class="quiet" data-delete aria-label="Delete ${esc(i.text)}">Delete</button></li>`,
          )
          .join("")
      : `<li class="empty">${filter === "Done" ? "Nothing finished yet." : "Nothing left. Add a task above."}</li>`;
    const left = items.filter((i) => !i.done).length;
    $("left").textContent = `${left} ${left === 1 ? "task" : "tasks"} left`;
    $("clear").disabled = !items.some((i) => i.done);
    const rename = $("items").querySelector(".rename");
    if (rename) {
      rename.focus();
      rename.select();
    }
  }

  $("add").addEventListener("submit", (event) => {
    event.preventDefault();
    const text = $("new").value.trim();
    if (!text) return;
    items.push(item(text));
    $("new").value = "";
    draw();
  });

  const at = (event) => Number(event.target.closest("li")?.dataset.id);

  $("items").addEventListener("change", (event) => {
    if (event.target.type !== "checkbox") return;
    const found = items.find((i) => i.id === at(event));
    found.done = event.target.checked;
    draw();
  });

  function save(id) {
    const text = $("items").querySelector(".rename").value.trim();
    if (text) items.find((i) => i.id === id).text = text;
    editing = null;
    draw();
  }

  $("items").addEventListener("click", (event) => {
    const id = at(event);
    const { edit, delete: remove, save: saving, cancel } = event.target.dataset;
    if (edit !== undefined) editing = id;
    else if (remove !== undefined) {
      const gone = items.find((i) => i.id === id);
      items = items.filter((i) => i.id !== id);
      toast(`Deleted "${gone.text}"`);
    } else if (saving !== undefined) return save(id);
    else if (cancel !== undefined) editing = null;
    else return;
    draw();
  });

  $("items").addEventListener("keydown", (event) => {
    if (!event.target.classList.contains("rename")) return;
    if (event.key === "Enter") save(at(event));
    if (event.key === "Escape") {
      editing = null;
      draw();
    }
  });

  $("filters").addEventListener("click", (event) => {
    const button = event.target.closest("button");
    if (!button) return;
    filter = button.textContent;
    for (const b of $("filters").children) b.setAttribute("aria-pressed", String(b === button));
    draw();
  });

  $("clear").addEventListener("click", () => {
    items = items.filter((i) => !i.done);
    draw();
  });

  draw();
</script>
</body>
</html>
